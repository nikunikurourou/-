<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杖劍傳說 吃飽飽賺錢錢</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* 強制所有元素使用像素字體與字體陰影增加清晰度 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DotGothic16', monospace !important;
            letter-spacing: 1px;
        }

        body {
            background-color: #111827; 
            background-size: contain;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: rgba(35, 51, 99, 0.85); 
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #3a4e8c;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 24px;
            color: #ffcb05;
            text-shadow: 2px 2px 0px #000000;
        }

        .header-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
        }

        .tab-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.4);
        }

        .tab-btn.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            font-weight: bold;
            border-color: #ffcb05;
        }

        .action-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
            white-space: nowrap;
        }

        .action-btn:hover { background-color: #3a4e8c; }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 0px 0px rgba(0,0,0,0.4); }

        .action-btn.add-recipe {
            background-color: #e74c3c;
            border-color: #ffffff;
        }
        .action-btn.add-recipe:hover { background-color: #c0392b; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 20px 0 15px 0;
            border-bottom: 2px dashed #3a4e8c;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 18px;
            color: #ffcb05;
            font-weight: bold;
            white-space: nowrap;
            margin-right: auto;
            text-shadow: 1px 1px 0px #000000;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .filter-tag-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #3a4e8c;
        }

        .tag-option {
            background-color: #1c284d;
            color: #b3c0e6;
            border: 2px solid #3a4e8c;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
            user-select: none;
        }

        .tag-option.sm {
            padding: 3px 8px;
            font-size: 12px;
            border-width: 1px;
        }

        .tag-option:hover {
            background-color: #2c3e75;
            color: #ffffff;
        }

        .tag-option.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            border-color: #ffcb05;
            font-weight: bold;
            box-shadow: 0 2px 0px rgba(0,0,0,0.4);
        }

        .search-input {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 0 10px;
            height: 32px;
            font-size: 13px;
            box-sizing: border-box;
            margin: 0;
            outline: none;
            vertical-align: middle;
            text-shadow: 1px 1px 0px #000000;
            width: 135px;
            flex-shrink: 0;
        }
        .search-input::placeholder { color: #8a9fc4; text-shadow: none; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            min-height: 80px;
        }

        .recipe-card {
            background-color: #1c284d;
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            padding: 0;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .recipe-card.unlearned { opacity: 0.82; }
        .recipe-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(0,0,0,0.65); border-color: #ffcb05; }
        .recipe-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }

        .recipe-card-header {
            padding: 9px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(90deg, #2980b9 0%, #1c284d 100%);
            position: relative;
        }
        .recipe-card.card-bg-稀有 .recipe-card-header {
            background: linear-gradient(90deg, #2980b9 0%, #1c355e 100%);
        }
        .recipe-card.card-bg-史詩 .recipe-card-header {
            background: linear-gradient(90deg, #8e44ad 0%, #311b47 100%);
        }
        .recipe-card.card-bg-傳說 .recipe-card-header {
            background: linear-gradient(90deg, #d35400 0%, #4a210f 100%);
        }
        .recipe-card.card-bg-奇蹟 .recipe-card-header {
            background: linear-gradient(90deg, #f39c12 0%, #594110 100%);
        }

        .recipe-card-title {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
            line-height: 1.2;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 2px 2px 0px #000000;
            flex: 1;
            min-width: 0;
        }

        .card-consume-btn {
            width: 28px;
            height: 28px;
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 0;
            font-size: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 0px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px #000;
            z-index: 5;
            transition: all 0.1s;
            flex-shrink: 0;
        }
        .card-consume-btn:hover { background: linear-gradient(180deg, #40d47e 0%, #2ecc71 100%); transform: scale(1.08); }
        .card-consume-btn:active { transform: translateY(2px); box-shadow: none; }

        .recipe-card-banner {
            background: radial-gradient(circle at 75% 50%, #263869 0%, #141e3a 75%);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 92px;
            border-bottom: 2px solid #3a4e8c;
            position: relative;
        }

        .recipe-demand-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 2;
        }

        .recipe-demand-label {
            font-size: 14px;
            color: #b3c0e6;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000000;
        }

        .recipe-demand-num {
            font-size: 26px;
            color: #ffcb05;
            font-weight: bold;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #000000;
        }

        .recipe-showcase-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(3px 4px 4px rgba(0,0,0,0.7));
            flex-shrink: 0;
            z-index: 2;
        }

        .recipe-card-footer {
            background-color: #1c284d;
            padding: 10px 12px 12px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .recipe-missing-title {
            font-size: 13px;
            color: #b3c0e6;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000000;
        }

        .recipe-missing-well {
            background-color: rgba(12, 18, 36, 0.65);
            border: 1px solid #3a4e8c;
            border-radius: 8px;
            padding: 10px;
            flex: 1;
            display: flex;
            align-items: center;
            min-height: 68px;
        }

        .recipe-ings-flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .missing-ing-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #8a9fc4;
            background: radial-gradient(circle, #2b3a67 20%, #151f3d 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .missing-ing-circle img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .missing-qty-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            background-color: rgba(15, 20, 35, 0.92);
            color: #ff4757;
            border: 1.5px solid #8a9fc4;
            border-radius: 4px;
            padding: 0px 4px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.15;
            text-shadow: 1px 1px 0px #000000;
            z-index: 3;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .recipe-icon, .ing-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        .ing-circle-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background-color: rgba(0,0,0,0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            overflow: hidden;
            flex-shrink: 0;
        }

        .ing-circle-icon img { width: 80%; height: 80%; object-fit: contain; background-color: transparent;}

        .compact-box {
            display: inline-flex;
            gap: 12px 10px;
            flex-wrap: wrap;
            background-color: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 8px;
            align-items: flex-start;
            width: fit-content;
            max-width: 100%;
        }
        .gathering-box { border: 2px dashed #ffcb05; margin-bottom: 5px; }
        .surplus-box { border: 2px dashed #2ecc71; }

        .surplus-section-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
        }

        .more-btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .gathering-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 68px;
        }

        .gathering-item-name {
            font-size: 12px;
            color: #ffffff;
            text-shadow: 1px 1px 0 #000;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sell-item-btn {
            background-color: #d35400;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            border-radius: 4px;
            padding: 1px 8px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 2px 0px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px #000;
            margin-top: 2px;
            transition: all 0.1s;
            white-space: nowrap;
        }
        .sell-item-btn:hover { background-color: #e67e22; transform: scale(1.05); }
        .sell-item-btn:active { transform: translateY(2px); box-shadow: none; }

        .game-trade-modal {
            background-color: #233363;
            border: 4px solid #ffffff;
            border-radius: 14px;
            width: 420px;
            max-width: 95%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.85);
            color: #ffffff;
            position: relative;
        }

        .game-trade-modal.editor-modal {
            width: 580px;
        }
        .game-trade-modal.editor-modal-sm {
            width: 480px;
        }

        .game-trade-header {
            background-color: #151f3d;
            padding: 14px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #3a4e8c;
            position: relative;
            min-height: 52px;
            flex-shrink: 0;
        }

        .game-trade-title-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .game-trade-title {
            font-size: 21px;
            color: #ffcb05;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            line-height: 1.1;
        }

        .game-trade-top-actions {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .game-editor-body {
            padding: 18px 20px;
            overflow-y: auto;
            flex: 1;
            background-color: #233363;
        }
        .game-editor-body::-webkit-scrollbar { width: 8px; }
        .game-editor-body::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }

        .editor-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 12px;
            border: 2px dashed #3a4e8c;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .game-trade-banner {
            background: radial-gradient(circle at 30% 50%, #2c3e75 0%, #1c284d 70%, #141d38 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #3a4e8c;
            min-height: 120px;
            flex-shrink: 0;
        }

        .game-trade-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-trade-label {
            font-size: 14px;
            color: #b3c0e6;
            text-shadow: 1px 1px 0 #000;
        }

        .game-trade-val {
            font-size: 28px;
            color: #ffcb05;
            font-weight: bold;
            line-height: 1.1;
            text-shadow: 2px 2px 0 #000;
        }

        .game-trade-sub {
            font-size: 13px;
            font-weight: bold;
            margin-top: 2px;
            text-shadow: 1px 1px 0 #000;
        }

        .game-trade-icon-wrap {
            position: relative;
            width: 84px;
            height: 84px;
            flex-shrink: 0;
        }

        .game-trade-icon-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background: radial-gradient(circle, #3b82f6 20%, #1d4ed8 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), inset 0 0 8px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            flex-shrink: 0;
        }

        .game-trade-icon-circle.circle-normal { background: radial-gradient(circle, #64748b 20%, #334155 90%); border-color: #94a3b8; }
        .game-trade-icon-circle.circle-rare { background: radial-gradient(circle, #3b82f6 20%, #1d4ed8 90%); border-color: #60a5fa; }
        .game-trade-icon-circle.circle-epic { background: radial-gradient(circle, #9333ea 20%, #581c87 90%); border-color: #c084fc; }
        .game-trade-icon-circle.circle-legend { background: radial-gradient(circle, #ea580c 20%, #7c2d12 90%); border-color: #fb923c; }
        .game-trade-icon-circle.circle-miracle { background: radial-gradient(circle, #ca8a04 20%, #713f12 90%); border-color: #fef08a; }

        .game-trade-icon-circle img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .game-trade-attr-corner {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 26px;
            height: 26px;
            background-color: #1e1e24;
            border-radius: 50%;
            border: 1.5px solid #45454f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }

        .game-trade-attr-corner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            image-rendering: pixelated;
        }

        .game-trade-recipe-section {
            background-color: #1c284d;
            border-bottom: 2px solid #3a4e8c;
        }

        .game-trade-section-bar {
            background-color: rgba(0, 0, 0, 0.25);
            padding: 8px 20px;
            font-size: 14px;
            color: #ffcb05;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 1px 1px 0 #000;
        }

        .game-trade-ings-box {
            padding: 14px 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            min-height: 110px;
        }

        .game-trade-qty-bar {
            background-color: #182242;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 2px solid #3a4e8c;
            flex-shrink: 0;
        }

        .game-trade-qty-label {
            font-size: 15px;
            color: #b3c0e6;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            white-space: nowrap;
        }

        .game-trade-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .game-round-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ffdd40 0%, #f39c12 100%);
            border: 2px solid #ffffff;
            color: #1c284d;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.6);
            user-select: none;
            transition: transform 0.1s, filter 0.1s;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
        }
        .game-round-btn:hover { filter: brightness(1.08); }
        .game-round-btn:active { transform: translateY(2px); box-shadow: none; }

        .game-round-btn svg {
            width: 16px;
            height: 16px;
            stroke: #1c284d;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            display: block;
        }

        .game-qty-pill {
            background-color: #111827;
            border: 2px solid #3a4e8c;
            border-radius: 18px;
            width: 118px;
            height: 34px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            color: #ffcb05;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
            text-shadow: 1px 1px 0 #000;
            line-height: 1;
        }

        .game-trade-footer {
            background-color: #182242;
            padding: 14px 20px 16px 20px;
            display: flex;
            gap: 14px;
            justify-content: space-between;
            border-top: 2px solid #3a4e8c;
            flex-shrink: 0;
        }

        .game-pill-btn {
            flex: 1;
            height: 44px;
            border-radius: 24px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, filter 0.1s;
            letter-spacing: 2px;
            color: #ffffff;
            border: 2px solid #ffffff;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.5);
        }
        .game-pill-btn:hover { filter: brightness(1.08); }
        .game-pill-btn:active { transform: translateY(3px); box-shadow: 0 1px 0px rgba(0, 0, 0, 0.5); }

        .game-pill-cancel {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
        }

        .game-pill-confirm {
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
        }

        .rank-rare { color: #5dade2 !important; text-shadow: 1px 1px 0px #000; }

        .rank-legend { color: #f39c12 !important; text-shadow: 1px 1px 0px #000; }

        .more-card .plus-icon { font-size: 32px; color: #ffffff; margin-bottom: 2px; text-shadow: 1px 1px 0 #000;}
        .more-card span { font-size: 14px; color: #ffffff; font-weight: bold; text-shadow: 1px 1px 0 #000;}

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);

            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #233363;
            border: 4px solid #ffffff;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);

            position: relative;

        .modal-content::-webkit-scrollbar { width: 8px; }

        .btn-mini {
            background-color: #1c284d;

            border-radius: 4px;
            padding: 3px 8px;

            box-shadow: 0 2px 0px rgba(0,0,0,0.5);

        .ing-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            border-radius: 8px;
        }
        @media (max-width: 520px) {
            .ing-grid-4 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 380px) {
            .ing-grid-4 { grid-template-columns: repeat(2, 1fr); }

        .ing-grid-card {
            background: linear-gradient(180deg, #2b3a67 0%, #1c284d 78%);
            border: 2px solid #4a62a8;
            border-radius: 10px;

            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.15s;

            justify-content: space-between;
        }

        .ing-grid-card.card-rank-一般 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(180, 190, 210, 0.35) 100%); }
        .ing-grid-card.card-rank-稀有 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(59, 130, 246, 0.5) 100%); }
        .ing-grid-card.card-rank-史詩 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(168, 85, 247, 0.55) 100%); }
        .ing-grid-card.card-rank-傳說 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(249, 115, 22, 0.6) 100%); }

        .ing-grid-card.selected-row {
            border-color: #ffcb05;
            box-shadow: 0 0 8px rgba(255, 203, 5, 0.6);
            background: linear-gradient(180deg, #3a4e8c 0%, #233363 75%, rgba(255, 203, 5, 0.45) 100%);
        }

        .ing-card-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 2;
        }

        .ing-qty-corner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ing-qty-label {

            text-shadow: 1px 1px 0 #000;

        .ing-grid-input {

            text-align: left;
            outline: none;

        }
        .ing-grid-input:focus {
            border-color: #ffcb05;
            background: rgba(0, 0, 0, 0.75);
        }

        .ing-card-pic {

            height: 46px;
            object-fit: contain;

        .ing-card-name {

        }

        .ing-card-name.editable-name {
            color: #ffcb05;
            cursor: pointer;
            text-decoration: underline;
        }

        .ing-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #ffcb05;
            cursor: pointer;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            border: 2px solid #3a4e8c;
            max-height: 55vh;
            overflow-y: auto;
        }
        @media (max-width: 520px) {
            .overview-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 400px) {
            .overview-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .overview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .overview-item:hover {
            transform: scale(1.06);
        }

        .overview-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #888;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        .overview-circle.circle-normal { background: radial-gradient(circle, #64748b 20%, #334155 90%); border-color: #94a3b8; }
        .overview-circle.circle-rare { background: radial-gradient(circle, #3b82f6 20%, #1d4ed8 90%); border-color: #60a5fa; }
        .overview-circle.circle-epic { background: radial-gradient(circle, #9333ea 20%, #581c87 90%); border-color: #c084fc; }
        .overview-circle.circle-legend { background: radial-gradient(circle, #ea580c 20%, #7c2d12 90%); border-color: #fb923c; }
        .overview-circle.circle-miracle { background: radial-gradient(circle, #ca8a04 20%, #713f12 90%); border-color: #fef08a; }

        .overview-food-img {
            width: 76%;
            height: 76%;
            object-fit: contain;
            image-rendering: pixelated;
            border-radius: 50%;
        }

        .overview-attr-badge {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 24px;
            height: 24px;
            background-color: #1e1e24;
            border-radius: 50%;
            border: 1.5px solid #45454f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .overview-attr-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .overview-name {
            font-size: 13px;
            color: #ffffff;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.2;
            word-break: keep-all;
        }

        .overview-subtext {
            font-size: 12px;
            color: #ffcb05;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.1;
        }

        .overview-item.dimmed-sufficient .overview-circle { filter: brightness(0.48) saturate(0.75); }
        .overview-item.dimmed-sufficient .overview-name { color: #9ca3af; }
        .overview-item.unlearned-gray .overview-circle { filter: grayscale(0.95) brightness(0.42); border-color: #52525b; }
        .overview-item.unlearned-gray .overview-name { color: #6b7280; }

        .close-btn, .save-btn {
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.5);
            width: 100%;
            margin-top: 15px;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
        }
        
        .close-btn { background-color: #e74c3c; }
        .close-btn:hover { background-color: #c0392b; }
        .save-btn { background-color: #2ecc71; }
        .save-btn:hover { background-color: #27ae60; }
        
        .close-btn:active, .save-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.5); }

        .text-input {
            width: 100%;
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 12px;
            outline: none;
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
        }
        .text-input:focus {
            border-color: #ffcb05;
        }

        label {
            font-size: 14px;
            color: #ffcb05;
            display: block;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>⚔️ 杖劍傳說 吃飽飽賺錢錢 🗡️</h1>
            <div class="header-btns">
                <button class="action-btn add-recipe" onclick="openAddRecipeModal()">➕ 新增食譜</button>
                <button class="action-btn" onclick="openInventoryEditModal()">📦 修改庫存</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchCharacter('rabbit', event)">小兔子</button>
            <button class="tab-btn" onclick="switchCharacter('artemis', event)">亞緹米絲</button>
        </div>

        <!-- 今日採集推薦區塊 -->
        <div class="section-header" style="margin-top: 0;">
            <span class="section-title">今日採集推薦 (點擊圖示可修改庫存)</span>
        </div>
        <div id="daily-gathering-container"></div>

        <div class="section-header">
            <span class="section-title">食譜</span>
            <div class="filter-group">
                <div class="filter-tag-group" id="main-learned-tags">
                    <span class="tag-option sm active" onclick="setMainFilter('learned', 'ALL', this)">全部狀態</span>
                    <span class="tag-option sm" onclick="setMainFilter('learned', 'LEARNED', this)">已習得</span>
                    <span class="tag-option sm" onclick="setMainFilter('learned', 'UNLEARNED', this)">未取得</span>
                </div>
                <div class="filter-tag-group" id="main-attr-tags">
                    <span class="tag-option sm active" onclick="setMainFilter('attr', 'ALL', this)">全部屬性</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '攻擊', this)">攻擊</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '速度', this)">速度</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '生命', this)">生命</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '防禦', this)">防禦</span>
                </div>
                <input type="text" id="recipe-search" class="search-input" placeholder="🔍 搜尋食譜...">
            </div>
        </div>
        <div id="recipe-container" class="grid-container"></div>
        <div class="more-btn-grid" style="margin-top: 15px;">
            <div class="more-card" onclick="openAllRecipesModal()">
                <div class="plus-icon">+</div>
                <span>更多食譜</span>
            </div>
        </div>

        <div class="section-header">
            <span class="section-title">可出售食材</span>
            <div class="filter-group">
                <input type="text" id="surplus-search" class="search-input" placeholder="🔍 搜尋食材...">
            </div>
        </div>
        <div id="surplus-container"></div>
    </div>

    <!-- 1. 食譜詳情與食用視窗 -->
    <div id="recipe-modal" class="modal" style="z-index: 120;">
        <div class="game-trade-modal">
            <input type="hidden" id="modal-recipe-index" value="-1">
            <div class="game-trade-header">
                <div class="game-trade-title-wrap">
                    <span id="modal-recipe-name" class="game-trade-title">食譜名稱</span>
                </div>
                <div class="game-trade-top-actions">
                    <button id="modal-edit-btn" class="btn-mini" title="編輯食譜">✏️</button>
                    <button id="modal-delete-btn" class="btn-mini" style="background-color:#e74c3c;" title="刪除食譜">🗑️</button>
                </div>
            </div>

            <div class="game-trade-banner">
                <div class="game-trade-info">
                    <span class="game-trade-label">需求數量</span>
                    <span id="modal-recipe-demand-val" class="game-trade-val">0</span>
                    <span id="modal-recipe-status-text" class="game-trade-sub" style="color:#2ecc71;">已習得</span>
                </div>
                <div class="game-trade-icon-wrap">
                    <div id="modal-recipe-attr-badge" class="game-trade-attr-corner" style="display: none;"></div>
                    <div id="modal-recipe-icon-circle" class="game-trade-icon-circle">
                        <img id="modal-recipe-icon-lg" src="" alt="Recipe Icon">
                    </div>
                </div>
            </div>

            <div class="game-trade-recipe-section">
                <div class="game-trade-section-bar">料理配方</div>
                <div id="modal-recipe-ingredients-flex" class="game-trade-ings-box"></div>
            </div>

            <div class="game-trade-qty-bar">
                <span class="game-trade-qty-label">數量</span>
                <div class="game-trade-controls">
                    <button type="button" class="game-round-btn" onclick="setMinRecipeEatQty()" title="最低食用數量" aria-label="最低">
                        <svg viewBox="0 0 24 24"><polyline points="7 7 12 12 17 7"></polyline><polyline points="7 13 12 18 17 13"></polyline></svg>
                    </button>
                    <button type="button" class="game-round-btn" onclick="stepRecipeEatQty(-1)" title="減少一份" aria-label="減少">
                        <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"></line></svg>
                    </button>
                    <div id="recipe-eat-qty-display" class="game-qty-pill">1</div>
                    <button type="button" class="game-round-btn" onclick="stepRecipeEatQty(1)" title="增加一份" aria-label="增加">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"></line><line x1="6" y1="12" x2="18" y2="12"></line></svg>
                    </button>
                    <button type="button" class="game-round-btn" onclick="setMaxRecipeEatQty()" title="最高需求數量" aria-label="最高">
                        <svg viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 17 12 12 7 17"></polyline></svg>
                    </button>
                </div>
            </div>

            <div class="game-trade-footer">
                <button type="button" class="game-pill-btn game-pill-cancel" onclick="closeRecipeDetailModal()">取消</button>
                <button type="button" class="game-pill-btn game-pill-confirm" onclick="confirmEatFromRecipeModal()">食用</button>
            </div>
        </div>
    </div>

    <!-- 2. 售出食材彈跳視窗 -->
    <div id="sell-ingredient-modal" class="modal" style="z-index: 125;">
        <div class="game-trade-modal">
            <input type="hidden" id="sell-ingredient-name" value="">
            <div class="game-trade-header">
                <div class="game-trade-title-wrap">
                    <span id="sell-modal-title" class="game-trade-title">食材名稱</span>
                </div>
            </div>
            <div class="game-trade-banner">
                <div class="game-trade-info">
                    <span class="game-trade-label">持有數量</span>
                    <span id="sell-modal-info-stock" class="game-trade-val">0</span>
                </div>
                <div id="sell-modal-icon-box" class="game-trade-icon-circle"></div>
            </div>
            <div class="game-trade-qty-bar">
                <span class="game-trade-qty-label">數量</span>
                <div class="game-trade-controls">
                    <button type="button" class="game-round-btn" onclick="setMinSellQty()" title="最低可售出數量" aria-label="最低">
                        <svg viewBox="0 0 24 24"><polyline points="7 7 12 12 17 7"></polyline><polyline points="7 13 12 18 17 13"></polyline></svg>
                    </button>
                    <button type="button" class="game-round-btn" onclick="stepSellQty(-1)" title="減少一份" aria-label="減少">
                        <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"></line></svg>
                    </button>
                    <div id="sell-qty-display" class="game-qty-pill">1</div>
                    <button type="button" class="game-round-btn" onclick="stepSellQty(1)" title="增加一份" aria-label="增加">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"></line><line x1="6" y1="12" x2="18" y2="12"></line></svg>
                    </button>
                    <button type="button" class="game-round-btn" onclick="setMaxSellQty()" title="最高可售出數量" aria-label="最高">
                        <svg viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 17 12 12 7 17"></polyline></svg>
                    </button>
                </div>
            </div>
            <div class="game-trade-footer">
                <button type="button" class="game-pill-btn game-pill-cancel" onclick="closeModal('sell-ingredient-modal')">取消</button>
                <button type="button" class="game-pill-btn game-pill-confirm" onclick="confirmSellIngredient()">售出</button>
            </div>
        </div>
    </div>

    <!-- 3. 新增 / 編輯食譜彈跳視窗 -->
    <div id="add-recipe-modal" class="modal" style="z-index: 130;">
        <div class="game-trade-modal editor-modal">
            <div class="game-trade-header">
                <div class="game-trade-title-wrap">
                    <span id="recipe-editor-title" class="game-trade-title">新增食譜</span>
                </div>
            </div>

            <div class="game-editor-body">
                <input type="hidden" id="editing-recipe-index" value="-1">
                <input type="hidden" id="new-recipe-icon-base64" value="">
                
                <label>食譜名稱：</label>
                <input type="text" id="new-recipe-name" class="text-input" placeholder="例如：豪華海鮮丼">
                
                <label>食譜品質：</label>
                <input type="hidden" id="new-recipe-rank" value="稀有">
                <div class="tag-group" id="new-recipe-rank-tags">
                    <span class="tag-option active" data-val="稀有" onclick="selectFormTag('new-recipe-rank', '稀有', this)">稀有 (藍)</span>
                    <span class="tag-option" data-val="史詩" onclick="selectFormTag('new-recipe-rank', '史詩', this)">史詩 (紫)</span>
                    <span class="tag-option" data-val="傳說" onclick="selectFormTag('new-recipe-rank', '傳說', this)">傳說 (橘)</span>
                    <span class="tag-option" data-val="奇蹟" onclick="selectFormTag('new-recipe-rank', '奇蹟', this)">奇蹟 (金)</span>
                </div>

                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div>
                        <label>習得狀態：</label>
                        <input type="hidden" id="new-recipe-status" value="true">
                        <div class="tag-group" id="new-recipe-status-tags">
                            <span class="tag-option active" data-val="true" onclick="selectFormTag('new-recipe-status', 'true', this)">已習得</span>
                            <span class="tag-option" data-val="false" onclick="selectFormTag('new-recipe-status', 'false', this)">未取得</span>
                        </div>
                    </div>
                    <div style="width: 110px;">
                        <label>需求數量：</label>
                        <input type="number" id="new-recipe-portions" class="text-input" value="1" min="0" style="width: 90px; height: 36px; text-align: center; font-size: 16px; font-weight: bold;">
                    </div>
                </div>

                <label>加成屬性：</label>
                <input type="hidden" id="new-recipe-attr" value="攻擊">

        function getCloudUrl() {
            let url = DEFAULT_FIREBASE_URL || '';
            return url ? url.trim().replace(/\/+$/, '') : '';
        }

        function getCloudJsonEndpoint() {
            const base = getCloudUrl();
            if (!base) return '';
            return base.endsWith('.json') ? base : `${base}/杖劍傳說資料.json`;
        }

        function applyFullDataObject(dataObj) {
            if (!dataObj || typeof dataObj !== 'object') return false;
            if (dataObj.ingredientsMap) localStorage.setItem('global_ingredients_map', JSON.stringify(dataObj.ingredientsMap));
            if (dataObj.rabbitRecipes) localStorage.setItem('recipes_rabbit', JSON.stringify(dataObj.rabbitRecipes.map(migrateRecipeFormat)));
            if (dataObj.artemisRecipes) localStorage.setItem('recipes_artemis', JSON.stringify(dataObj.artemisRecipes.map(migrateRecipeFormat)));
            if (dataObj.rabbitInv) localStorage.setItem('inv_rabbit', JSON.stringify(dataObj.rabbitInv));
            if (dataObj.artemisInv) localStorage.setItem('inv_artemis', JSON.stringify(dataObj.artemisInv));
            renderUI();
            return true;
        }

        async function pushToCloud() {
            const endpoint = getCloudJsonEndpoint();
            if (!endpoint) return;

            lastLocalPushTimestamp = Date.now();
            const payload = {
                updatedAt: lastLocalPushTimestamp,
                ingredientsMap: getIngredientsMap(),
                rabbitRecipes: getRecipes('rabbit'),
                artemisRecipes: getRecipes('artemis'),
                rabbitInv: getInventory('rabbit'),
                artemisInv: getInventory('artemis')
            };

            try {
                await fetch(endpoint, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {}
        }

        async function pullFromCloud() {
            const endpoint = getCloudJsonEndpoint();
            if (!endpoint) return false;

            try {
                const res = await fetch(endpoint);
                if (!res.ok) return false;
                const data = await res.json();
                if (data && (data.rabbitInv || data.rabbitRecipes)) {
                    applyFullDataObject(data);
                    return true;
                } else {
                    await pushToCloud();
                    return true;
                }
            } catch (e) {
                return false;
            }
        }

        function startCloudRealtimeStream() {
            if (cloudEventSource) {
                cloudEventSource.close();
                cloudEventSource = null;
            }
            const endpoint = getCloudJsonEndpoint();
            if (!endpoint) return;

            pullFromCloud();

            try {
                cloudEventSource = new EventSource(endpoint);
                cloudEventSource.addEventListener('put', (e) => {
                    try {
                        const packet = JSON.parse(e.data);
                        if (!packet || !packet.data) return;
                        if (packet.path === '/' && packet.data.updatedAt && Math.abs(packet.data.updatedAt - lastLocalPushTimestamp) < 2500) {
                            return;
                        }
                        if (packet.path === '/' && (packet.data.rabbitInv || packet.data.rabbitRecipes)) {
                            applyFullDataObject(packet.data);
                        } else {
                            pullFromCloud();
                        }
                    } catch (err) {}
                });
            } catch (err) {}
        }

            if (getCloudUrl()) pullFromCloud();

            }
        });

        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function migrateRecipeFormat(r) {
            try {
                if (!r.ingredients) r.ingredients = {};
                if (r.portions === undefined) {
                    const vals = Object.values(r.ingredients).filter(v => v > 0);
                    if (vals.length > 0) {
                        let g = vals[0];
                        for (let i = 1; i < vals.length; i++) g = gcd(g, vals[i]);
                        if (g > 1) {
                            r.portions = g;
                            for (let k in r.ingredients) {
                                r.ingredients[k] = r.ingredients[k] > 0 ? Math.round(r.ingredients[k] / g) : 1;
                            }
                        } else {
                            r.portions = 1;
                            for (let k in r.ingredients) {
                                if (r.ingredients[k] === 0) r.ingredients[k] = 1;
                            }
                        }
                    } else {
                        r.portions = 0;
                        for (let k in r.ingredients) {
                            if (r.ingredients[k] === 0) r.ingredients[k] = 1;
                        }
                    }
                }
            } catch(e) {
                r.portions = 1;
            }
            return r;
        }

        function onIngQtyInput(input) {
            const card = input.closest('.ing-grid-card');
            const checkbox = card.querySelector('.ing-checkbox');
            const val = parseInt(input.value) || 0;
            if (val > 0 && !checkbox.checked) {
                checkbox.checked = true;
                card.classList.add('selected-row');
            } else if (val === 0 && checkbox.checked) {
                checkbox.checked = false;
                card.classList.remove('selected-row');
            }
        }

        function sortRecipeIngCards() {
            const container = document.getElementById('new-recipe-ingredients-list');
            if (!container) return;
            const cards = Array.from(container.querySelectorAll('.ing-grid-card'));
            cards.sort((a, b) => {
                const aChecked = a.querySelector('.ing-checkbox').checked ? 1 : 0;
                const bChecked = b.querySelector('.ing-checkbox').checked ? 1 : 0;
                if (aChecked !== bChecked) return bChecked - aChecked;
                const aOrder = parseInt(a.getAttribute('data-order')) || 0;
                const bOrder = parseInt(b.getAttribute('data-order')) || 0;
                return aOrder - bOrder;
            });
            cards.forEach(c => container.appendChild(c));
        }

        window.imgErr = function(img) {
            if (img.dataset.loaded === 'true') return;
            let name = img.getAttribute('data-name');
            let def = img.getAttribute('data-fallback');
            let attempt = parseInt(img.getAttribute('data-attempt') || '0');
            attempt++;
            img.setAttribute('data-attempt', attempt);
            if (attempt === 1) img.src = name + '.jpg';
            else if (attempt === 2) img.src = name + '.jpeg';
            else {
                img.dataset.loaded = 'true';
                img.onerror = null;
                if (def) img.src = def;
                else img.style.display = 'none';
            }
        };

            function tryNextBg() {
                if (bgIndex >= bgList.length) {
                    document.body.style.backgroundColor = '#111827';
                    return; 
                }
                let img = new Image();
                img.onload = () => { document.body.style.backgroundImage = `url('${bgList[bgIndex]}')`; };
                img.onerror = () => { bgIndex++; tryNextBg(); };
                img.src = bgList[bgIndex];
            }
            tryNextBg();
        }

            const mapKeys = Object.keys(map);

            INGREDIENT_ORDER.forEach(item => { ordered.push(item); });
            mapKeys.forEach(item => {
                if (!ordered.includes(item)) ordered.push(item);
            });
            return ordered;
        }

        function getSortedRecipeIngredientsEntries(ingredientsObj) {
            if (!ingredientsObj) return [];
            const entries = Object.entries(ingredientsObj);
            entries.sort((a, b) => {
                let idxA = INGREDIENT_ORDER.indexOf(a[0]);
                let idxB = INGREDIENT_ORDER.indexOf(b[0]);
                if (idxA === -1) idxA = 9999;
                if (idxB === -1) idxB = 9999;
                return idxA - idxB;
            });
            return entries;
        }

        function calculateRecipeShortage(recipe, inv) {
            const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;
            let missingItems = [];
            let allItems = [];
            let totalMissing = 0;      
            let rawTotalMissing = 0;   

            if (recipe && recipe.ingredients) {
                const sortedEntries = getSortedRecipeIngredientsEntries(recipe.ingredients);
                for (let [ing, perPortionQty] of sortedEntries) {
                    const requiredQty = perPortionQty * portions;
                    const invQty = inv[ing] || 0;
                    const diff = Math.max(0, requiredQty - invQty);
                    if (diff > 0) {
                        rawTotalMissing += diff;
                        if (!EXCLUDED_INGS.includes(ing)) {
                            totalMissing += diff;
                        }
                        missingItems.push({ name: ing, perPortionQty, requiredQty, invQty, diff });
                    }
                    allItems.push({ name: ing, perPortionQty, requiredQty, invQty, diff });
                }
            }
            return { portions, totalMissing, rawTotalMissing, missingItems, allItems };
        }

        function sortRecipesByMissing(recipes, inv) {
            let scoredRecipes = recipes.map((recipe, index) => {
                const shortage = calculateRecipeShortage(recipe, inv);
                return {
                    ...recipe,
                    originalIndex: index,
                    portions: shortage.portions,
                    missingTotal: shortage.totalMissing,
                    rawTotalMissing: shortage.rawTotalMissing,
                    missingItems: shortage.missingItems,
                    allItems: shortage.allItems
                };
            });

            scoredRecipes.sort((a, b) => {
                const aGroup = a.missingTotal > 0 ? 0 : (a.portions > 0 ? 1 : 2);
                const bGroup = b.missingTotal > 0 ? 0 : (b.portions > 0 ? 1 : 2);
                if (aGroup !== bGroup) return aGroup - bGroup;
                if (aGroup === 0) return a.missingTotal - b.missingTotal;
                return (rankWeight[b.rank] || 1) - (rankWeight[a.rank] || 1);
            });

            return scoredRecipes;
        }

        function getMinSellThreshold(rank) {
            if (rank === "一般") return 5;
            if (rank === "稀有") return 3;
            return 1;
        }

        function getValidSurplusList(recipes, inv, ingMap) {
            let totalDemand = {};
            recipes.forEach(recipe => {
                const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;
                if (recipe.ingredients && portions > 0) {
                    for (let [ing, perPortionQty] of Object.entries(recipe.ingredients)) {
                        totalDemand[ing] = (totalDemand[ing] || 0) + (perPortionQty * portions);
                    }
                }
            });

            let surplusList = [];
            for (let [item, invQty] of Object.entries(inv)) {
                if (EXCLUDED_INGS.includes(item)) continue;
                const demQty = totalDemand[item] || 0;
                const rawSurplus = invQty - demQty;
                if (rawSurplus > 0) {
                    const ingMeta = ingMap[item] || { rank: "一般", icon: "" };
                    const rank = ingMeta.rank || "一般";
                    const minThreshold = getMinSellThreshold(rank);
                    if (rawSurplus >= minThreshold) {
                        surplusList.push({
                            name: item,
                            inventory: invQty,
                            demand: demQty,
                            surplus: rawSurplus,
                            groupSize: minThreshold,
                            ...ingMeta
                        });
                    }
                }
            }
            return surplusList;
        }

        // ==================== 升級版：今日推薦食材判定演算法 ====================
        // 規則 1：可完成食譜的食材優先 (食譜差越少項越優先；單一食譜需求量越少越優先)
        // 規則 2：可採集食材優先大於昇華食材
        // 規則 3：食譜若含有非採集且非昇華的食材(如嫩肉/精肉等)，該食譜食材優先順序降低
        function renderDailyGathering() {
            const container = document.getElementById('daily-gathering-container');
            if (!container) return;
            container.innerHTML = '';

            const recipes = getRecipes(currentKey);
            const inv = getInventory(currentKey);
            const ingMap = getIngredientsMap();

            let candidates = {};
            GATHERABLE_INGS.forEach(g => {
                const tier = (ingMap[g] && ingMap[g].rank) ? ingMap[g].rank : "一般";
                candidates[g] = {
                    name: g,
                    tier: tier,
                    bestRecipeMissingCount: 999, // 食譜差幾項完成 (越小越優先)
                    minSingleDeficit: 999999,    // 單一食譜的最小缺少量 (越小越優先)
                    hasDirectDeficit: false,     // 是否直接缺少該可採集食材 (優先於昇華)
                    pureGatherableRecipe: false, // 是否存在純採集/昇華的食譜
                    hasAnyDeficit: false
                };
            });

            recipes.forEach(recipe => {
                const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;
                if (!recipe.ingredients || portions <= 0) return;

                let recipeMissingItems = [];
                let hasUnobtainableIng = false;

                for (let [ing, perPortion] of Object.entries(recipe.ingredients)) {
                    if (EXCLUDED_INGS.includes(ing)) continue;
                    const req = perPortion * portions;
                    const cur = inv[ing] || 0;
                    const diff = Math.max(0, req - cur);
                    if (diff > 0) {
                        recipeMissingItems.push({ ing, diff });
                    }
                    // 檢查是否為非採集且非昇華的食材 (例如嫩肉、精肉、青禾等)
                    const isGatherable = GATHERABLE_INGS.includes(ing);
                    const isUpgraded = Object.prototype.hasOwnProperty.call(REVERSE_UPGRADE_MAP, ing);
                    if (!isGatherable && !isUpgraded) {
                        hasUnobtainableIng = true;
                    }
                }

                const missingCount = recipeMissingItems.length;
                if (missingCount > 0) {
                    recipeMissingItems.forEach(item => {
                        let targetBase = null;
                        let isDirect = false;

                        if (GATHERABLE_INGS.includes(item.ing)) {
                            targetBase = item.ing;
                            isDirect = true;
                        } else if (REVERSE_UPGRADE_MAP[item.ing]) {
                            targetBase = REVERSE_UPGRADE_MAP[item.ing];
                            isDirect = false;
                        }

                        if (targetBase && candidates[targetBase]) {
                            const c = candidates[targetBase];
                            c.hasAnyDeficit = true;
                            if (isDirect) c.hasDirectDeficit = true;
                            if (!hasUnobtainableIng) c.pureGatherableRecipe = true;

                            if (missingCount < c.bestRecipeMissingCount) {
                                c.bestRecipeMissingCount = missingCount;
                            }
                            if (item.diff < c.minSingleDeficit) {
                                c.minSingleDeficit = item.diff;
                            }
                        }
                    });
                }
            });

            let candidatesByTier = { "一般": [], "稀有": [], "史詩": [] };
            Object.values(candidates).forEach(c => {
                if (c.hasAnyDeficit && candidatesByTier[c.tier]) {
                    candidatesByTier[c.tier].push(c);
                }
            });

            const tiers = ["一般", "稀有", "史詩"];
            container.className = "compact-box gathering-box";

            tiers.forEach(tier => {
                let list = candidatesByTier[tier];
                if (list && list.length > 0) {
                    list.sort((a, b) => {
                        // 1. 食譜缺少的食材種類數越少越優先 (例如差1項食譜優先於差2項)
                        if (a.bestRecipeMissingCount !== b.bestRecipeMissingCount) {
                            return a.bestRecipeMissingCount - b.bestRecipeMissingCount;
                        }
                        // 2. 食譜是否為純採集食材 (無不可採集食材者優先)
                        if (a.pureGatherableRecipe !== b.pureGatherableRecipe) {
                            return a.pureGatherableRecipe ? -1 : 1;
                        }
                        // 3. 可直接採集優先於昇華食材
                        if (a.hasDirectDeficit !== b.hasDirectDeficit) {
                            return a.hasDirectDeficit ? -1 : 1;
                        }
                        // 4. 單一食譜缺少數量最少者優先
                        if (a.minSingleDeficit !== b.minSingleDeficit) {
                            return a.minSingleDeficit - b.minSingleDeficit;
                        }
                        return 0;
                    });

                    const chosen = list[0];
                    const ingMeta = ingMap[chosen.name] || { icon: "" };
                    const safeName = chosen.name.replace(/'/g, "\\'");
                    container.innerHTML += `
                        <div class="gathering-item" onclick="openQuickStockModal('${safeName}')" style="cursor: pointer;" title="點擊直接修改 ${chosen.name} 庫存">
                            <div class="ing-circle-icon">
                                ${renderImgHtml(ingMeta.icon, "", defaultIngIconImg, chosen.name)}
                            </div>
                            <span class="gathering-item-name" title="${chosen.name}">${chosen.name}</span>
                        </div>
                    `;
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<span style="font-size:13px; color:#2ecc71; font-weight:bold; text-shadow: 1px 1px 0 #000;">目前所有可拾取與昇華食材皆充足 ✓</span>`;
            }
        }

        function openSellModal(ingName, surplusQty, evt) {
            if (evt) evt.stopPropagation();
            const inv = getInventory(currentKey);
            const ingMap = getIngredientsMap();
            const currentStock = inv[ingName] || 0;
            const ingMeta = ingMap[ingName] || { rank: "一般", icon: "" };
            const rank = ingMeta.rank || "一般";

            currentSellStep = getMinSellThreshold(rank);
            currentSellMin = currentSellStep;
            currentSellMax = Math.floor(surplusQty / currentSellStep) * currentSellStep;
            if (currentSellMax < currentSellMin) currentSellMax = currentSellMin;

            currentSellQty = currentSellMax;

            document.getElementById('sell-ingredient-name').value = ingName;
            document.getElementById('sell-modal-title').innerText = ingName;
            document.getElementById('sell-modal-info-stock').innerText = currentStock;

            const iconBox = document.getElementById('sell-modal-icon-box');
            iconBox.className = `game-trade-icon-circle ${getCircleRankClass(rank)}`;
            iconBox.innerHTML = renderImgHtml(ingMeta.icon, "", defaultIngIconImg, ingName);

            updateSellDisplay();
            document.getElementById('sell-ingredient-modal').style.display = 'flex';

        }

        function stepSellQty(dir) {
            let nextVal = currentSellQty + (dir * currentSellStep);
            if (nextVal < currentSellMin) nextVal = currentSellMin;
            if (nextVal > currentSellMax) nextVal = currentSellMax;
            currentSellQty = nextVal;
            updateSellDisplay();
        }

        }

            currentRecipeEatQty = currentRecipeEatMax;
            updateRecipeEatDisplay();
        }

        function stepRecipeEatQty(dir) {
            let nextVal = currentRecipeEatQty + dir;
            if (nextVal < currentRecipeEatMin) nextVal = currentRecipeEatMin;
            if (nextVal > currentRecipeEatMax) nextVal = currentRecipeEatMax;
            currentRecipeEatQty = nextVal;
            updateRecipeEatDisplay();
        }

        function confirmEatFromRecipeModal() {
            const recipeIndex = parseInt(document.getElementById('modal-recipe-index').value);
            const count = currentRecipeEatQty;

            if (count <= 0) return;

            const recipes = getRecipes(currentKey);
            const inv = getInventory(currentKey);
            const recipe = recipes[recipeIndex];
            if (!recipe) return;

            if (recipe.ingredients) {
                for (let [ing, perPortionQty] of Object.entries(recipe.ingredients)) {
                    const deduct = perPortionQty * count;
                    inv[ing] = Math.max(0, (inv[ing] || 0) - deduct);
                }
            }

            const currentPortions = recipe.portions !== undefined ? Number(recipe.portions) : 0;
            recipe.portions = Math.max(0, currentPortions - count);

            localStorage.setItem(`inv_${currentKey}`, JSON.stringify(inv));
            localStorage.setItem(`recipes_${currentKey}`, JSON.stringify(recipes));
            pushToCloud();

            closeModal('recipe-modal');
            renderUI();

            if (openedFromAllRecipes) {
                openAllRecipesModal();
            }
        }

            closeModal('recipe-modal');

        function openAllRecipesModal() {
            const recipes = getRecipes(currentKey);
            const inv = getInventory(currentKey);
            const listContainer = document.getElementById('all-recipes-list');
            listContainer.innerHTML = '';

            const filterKey = document.getElementById('all-recipes-search')?.value.trim().toLowerCase() || '';

            let scoredRecipes = recipes.map((recipe, index) => {
                const shortage = calculateRecipeShortage(recipe, inv);
                return {
                    ...recipe,
                    originalIndex: index,
                    portions: shortage.portions,
                    missingTotal: shortage.totalMissing,
                    rawTotalMissing: shortage.rawTotalMissing
                };
            });

            scoredRecipes.sort((a, b) => {
                const wA = rankWeight[a.rank] || 1;
                const wB = rankWeight[b.rank] || 1;
                if (wA !== wB) return wB - wA;
                return a.originalIndex - b.originalIndex;
            });

            if (currentModalLearnedFilter === 'LEARNED') {
                scoredRecipes = scoredRecipes.filter(r => r.learned !== false);
            } else if (currentModalLearnedFilter === 'UNLEARNED') {
                scoredRecipes = scoredRecipes.filter(r => r.learned === false);
            }

            if (currentModalAttrFilter !== 'ALL') {
                scoredRecipes = scoredRecipes.filter(r => r.attr === currentModalAttrFilter);
            }

            if (filterKey) {
                scoredRecipes = scoredRecipes.filter(r => r.name.toLowerCase().includes(filterKey));
            }

            if (scoredRecipes.length === 0) {
                listContainer.innerHTML = `<p style="color: #ffffff; text-shadow: 1px 1px 0 #000; padding: 10px; grid-column: 1 / -1;">找不到符合的食譜。</p>`;
            } else {
                scoredRecipes.forEach(recipe => {
                    const circleRankClass = getCircleRankClass(recipe.rank || "稀有");
                    
                    let stateClass = '';
                    if (recipe.learned === false) {
                        stateClass = 'unlearned-gray';

                        stateClass = 'active-missing';
                    } else {
                        stateClass = 'dimmed-sufficient';

                    const attrBaseName = attrIconMap[recipe.attr];
                    const safeAttr = attrBaseName ? String(attrBaseName).replace(/"/g, "&quot;") : "";

                        : '';

                        <div class="overview-item ${stateClass}" onclick="closeModal('all-recipes-modal'); openRecipeDetailByIndex(${recipe.originalIndex}, true)" title="${recipe.name} (${recipe.rank || '稀有'})">

            surplusList.sort((a, b) => {
                const wA = rankWeight[a.rank] !== undefined ? rankWeight[a.rank] : 0;
                const wB = rankWeight[b.rank] !== undefined ? rankWeight[b.rank] : 0;

        function saveSingleIngredientInfo() {
            const origName = document.getElementById('editing-ing-original-name').value;
            const newName = document.getElementById('edit-ing-name').value.trim();
            const newRank = document.getElementById('edit-ing-rank').value;
            const newIcon = document.getElementById('edit-ing-icon-base64').value;

            if (!newName) {
                alert('請輸入食材名稱！');
                return;
            }

            let ingMap = getIngredientsMap();

            if (origName) {
                if (origName !== newName && ingMap[newName]) {
                    alert('已有該食材！');
                    return;
                }
                if (origName !== newName) {
                    delete ingMap[origName];
                    ['rabbit', 'artemis'].forEach(key => {
                        let inv = getInventory(key);
                        if (inv[origName] !== undefined) {
                            inv[newName] = inv[origName];
                            delete inv[origName];
                            localStorage.setItem(`inv_${key}`, JSON.stringify(inv));
                        }
                        let recipes = getRecipes(key);
                        recipes.forEach(r => {
                            if (r.ingredients && r.ingredients[origName] !== undefined) {
                                r.ingredients[newName] = r.ingredients[origName];
                                delete r.ingredients[origName];
                            }
                        });
                        localStorage.setItem(`recipes_${key}`, JSON.stringify(recipes));
                    });
                }
                ingMap[newName] = { rank: newRank, icon: newIcon };
            } else {
                if (ingMap[newName]) {
                    alert('已有該食材！');
                    return;
                }
                ingMap[newName] = { rank: newRank, icon: newIcon };
            }

            saveIngredientsMap(ingMap);
            pushToCloud();
            closeModal('edit-ingredient-item-modal');

            if (addIngReturnTarget === 'recipe') {
                const currentSelections = {};
                document.querySelectorAll('#new-recipe-ingredients-list .ing-grid-card').forEach(card => {
                    const cb = card.querySelector('.ing-checkbox');

            document.getElementById('new-recipe-portions').value = portions;
            
            setTagGroupValue('new-recipe-rank', 'new-recipe-rank-tags', recipe.rank || '稀有');
            setTagGroupValue('new-recipe-status', 'new-recipe-status-tags', recipe.learned !== false ? 'true' : 'false');
            setTagGroupValue('new-recipe-attr', 'new-recipe-attr-tags', recipe.attr || '攻擊');
            
            document.getElementById('new-recipe-icon-base64').value = recipe.icon || '';
            
            const preview = document.getElementById('new-recipe-icon-preview');
            preview.removeAttribute('data-loaded');
            if (recipe.icon && recipe.icon.startsWith('data:image')) {
                preview.onerror = null;
                preview.src = recipe.icon;
            } else {
                preview.setAttribute('data-name', recipe.name);
                preview.setAttribute('data-fallback', defaultRecipeIconImg);
                preview.setAttribute('data-attempt', '0');
                preview.onerror = function() { window.imgErr(this); };
                preview.src = `${recipe.name}.png`;
            }
            preview.style.display = 'block';
            
            document.getElementById('recipe-file-input').value = '';
            document.getElementById('recipe-ing-search').value = '';

            populateRecipeIngredientsGrid(recipe.ingredients || {});

            document.getElementById('add-recipe-modal').style.display = 'flex';
        }

        function saveRecipe() {
            const name = document.getElementById('new-recipe-name').value.trim();
            const rank = document.getElementById('new-recipe-rank').value;
            const learned = document.getElementById('new-recipe-status').value === 'true';
            const portions = Math.max(0, parseInt(document.getElementById('new-recipe-portions').value) || 0);
            const attr = document.getElementById('new-recipe-attr').value;
            const icon = document.getElementById('new-recipe-icon-base64').value;
            const editIndex = parseInt(document.getElementById('editing-recipe-index').value);

            if (!name) {
                alert('請輸入食譜名稱！');
                return;
            }

            const recipes = getRecipes(currentKey);
            const duplicateIdx = recipes.findIndex((r, idx) => r.name === name && idx !== editIndex);
            if (duplicateIdx !== -1) {
                alert('已有該食譜！');
                return;
            }

            let rawIngredients = {};
            const cards = document.querySelectorAll('#new-recipe-ingredients-list .ing-grid-card');
            cards.forEach(card => {
                const checkbox = card.querySelector('.ing-checkbox');
                const input = card.querySelector('.new-ing-input');
                const item = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                if (checkbox.checked || val > 0) {
                    rawIngredients[item] = val;
                }
            });

            if (Object.keys(rawIngredients).length === 0) {
                alert('請至少勾選一項所需食材！');
                return;
            }

            let ingredients = {};
            getSortedRecipeIngredientsEntries(rawIngredients).forEach(([k, v]) => {
                ingredients[k] = v;
            });

            const recipeObj = { name, rank, learned, portions, attr, icon, ingredients };
            const otherKey = currentKey === 'rabbit' ? 'artemis' : 'rabbit';
            let otherRecipes = getRecipes(otherKey);

            let targetIndex = editIndex;

            if (editIndex >= 0 && editIndex < recipes.length) {
                const oldName = recipes[editIndex].name;
                recipes[editIndex] = recipeObj;

                const otherIdx = otherRecipes.findIndex(r => r.name === oldName || r.name === name);
                if (otherIdx !== -1) {
                    otherRecipes[otherIdx] = {
                        ...otherRecipes[otherIdx],
                        name,
                        rank,
                        attr,
                        icon: icon || otherRecipes[otherIdx].icon,
                        ingredients: { ...ingredients }
                    };
                } else {
                    otherRecipes.push({
                        name,
                        rank,
                        learned: false,
                        portions: 0,
                        attr,
                        icon,
                        ingredients: { ...ingredients }
                    });
                }
            } else {
                recipes.push(recipeObj);
                targetIndex = recipes.length - 1;

                if (!otherRecipes.some(r => r.name === name)) {
                    otherRecipes.push({
                        name,
                        rank,
                        learned: false,
                        portions: 0,
                        attr,
                        icon,
                        ingredients: { ...ingredients }
                    });
                }
            }

            localStorage.setItem(`recipes_${currentKey}`, JSON.stringify(recipes));
            localStorage.setItem(`recipes_${otherKey}`, JSON.stringify(otherRecipes));
            pushToCloud();
            closeModal('add-recipe-modal');
            renderUI();

            if (openedFromAllRecipes) {
                openAllRecipesModal();
            } else {
                openRecipeDetailByIndex(targetIndex, false);
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function setupSearchInputs() {
            const bindSearch = (id, callback) => {
                const el = document.getElementById(id);
                if (!el) return;
                let isComposing = false;
                el.addEventListener('compositionstart', () => { isComposing = true; });
                el.addEventListener('compositionend', () => {
                    isComposing = false;
                    callback();
                });
                el.addEventListener('input', () => {
                    if (!isComposing) callback();
                });
            };

            bindSearch('recipe-search', renderUI);
            bindSearch('surplus-search', renderUI);
            bindSearch('all-recipes-search', openAllRecipesModal);
            bindSearch('all-surplus-search', openAllSurplusModal);
            bindSearch('inv-search', filterInventoryList);
            bindSearch('recipe-ing-search', filterRecipeIngList);
        }

        syncBothCharactersRecipes();
        setupSearchInputs();
        renderUI();
        startCloudRealtimeStream();
    </script>
</body>
</html>
