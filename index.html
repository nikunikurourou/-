<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杖劍傳說 吃飽飽賺錢錢</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* 強制所有元素使用像素字體與字體陰影增加清晰度 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DotGothic16', monospace !important;
            letter-spacing: 1px;
        }

        /* 背景：全顯示不裁切 (contain)，JS會自動載入背景圖片 */
        body {
            background-color: #111827; 
            background-size: contain;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        /* 主容器：深藍色帶有 85% 不透明度，讓背景微透 */
        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: rgba(35, 51, 99, 0.85); 
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #3a4e8c;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 24px;
            color: #ffcb05;
            text-shadow: 2px 2px 0px #000000;
        }

        .header-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 角色切換標籤 */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
        }

        .tab-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.4);
        }

        .tab-btn.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            font-weight: bold;
            border-color: #ffcb05;
        }

        /* 動作按鈕 */
        .action-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
        }

        .action-btn:hover { background-color: #3a4e8c; }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 0px 0px rgba(0,0,0,0.4); }

        .action-btn.add-recipe {
            background-color: #e74c3c;
            border-color: #ffffff;
        }
        .action-btn.add-recipe:hover { background-color: #c0392b; }

        /* 區塊標題與篩選列 */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 20px 0 15px 0;
            border-bottom: 2px dashed #3a4e8c;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 18px;
            color: #ffcb05;
            font-weight: bold;
            white-space: nowrap;
            margin-right: auto;
            text-shadow: 1px 1px 0px #000000;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* 點選標籤群組樣式 (取代下拉選單) */
        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .filter-tag-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #3a4e8c;
        }

        .tag-option {
            background-color: #1c284d;
            color: #b3c0e6;
            border: 2px solid #3a4e8c;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
            user-select: none;
        }

        .tag-option.sm {
            padding: 3px 8px;
            font-size: 12px;
            border-width: 1px;
        }

        .tag-option:hover {
            background-color: #2c3e75;
            color: #ffffff;
        }

        .tag-option.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            border-color: #ffcb05;
            font-weight: bold;
            box-shadow: 0 2px 0px rgba(0,0,0,0.4);
        }

        /* 搜尋輸入框 */
        .search-input {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 0 10px;
            height: 32px;
            font-size: 13px;
            box-sizing: border-box;
            margin: 0;
            outline: none;
            vertical-align: middle;
            text-shadow: 1px 1px 0px #000000;
            width: 135px;
            flex-shrink: 0;
        }
        .search-input::placeholder { color: #8a9fc4; text-shadow: none; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            min-height: 80px;
        }

        /* 卡片樣式 */
        .recipe-card {
            background-color: #1c284d;
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .recipe-card.unlearned { background-color: #111827; opacity: 0.8; }
        .recipe-card:hover { background-color: #3a4e8c; transform: translate(-2px, -2px); box-shadow: 5px 5px 0px rgba(0,0,0,0.5); }
        .recipe-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }

        .recipe-header-flex { display: flex; align-items: center; gap: 12px; }

        .recipe-icon, .ing-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 4px;
            background-color: transparent;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        /* 屬性圖示 */
        .attr-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
            background-color: transparent;
        }

        /* 圓形食材 ICON 容器 */
        .ing-circle-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background-color: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .ing-circle-icon img { width: 80%; height: 80%; object-fit: contain; background-color: transparent;}

        /* 食譜品質等級標題顏色 */
        .rank-rare { color: #5dade2 !important; text-shadow: 1px 1px 0px #000; }
        .rank-epic { color: #c39bd3 !important; text-shadow: 1px 1px 0px #000; }
        .rank-legend { color: #f39c12 !important; text-shadow: 1px 1px 0px #000; }
        .rank-miracle { color: #f1c40f !important; text-shadow: 1px 1px 0px #d35400; }

        /* 食譜品質漸層背景 */
        .bg-rank-rare { background: linear-gradient(135deg, #2980b9, #1c284d); }
        .bg-rank-epic { background: linear-gradient(135deg, #8e44ad, #1c284d); }
        .bg-rank-legend { background: linear-gradient(135deg, #d35400, #1c284d); }
        .bg-rank-miracle { background: linear-gradient(135deg, #f39c12, #1c284d); }

        .recipe-card p { font-size: 13px; color: #b3c0e6; margin: 0; text-shadow: 1px 1px 0px #000; }

        /* 食材狀態列表 */
        .missing-ing-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: rgba(0,0,0,0.4);
            border: 1px dashed #e74c3c;
            padding: 8px;
            border-radius: 4px;
        }

        .missing-ing-list.sufficient-border {
            border-color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.08);
        }

        .missing-ing-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ffffff; text-shadow: 1px 1px 0 #000;}
        .qty-red { color: #ff4757; font-weight: bold; font-size: 14px; margin-left: auto;}
        .qty-green { color: #2ecc71; font-weight: bold; font-size: 13px; margin-left: auto;}

        /* 「+」展開按鈕卡片 */
        .more-card {
            background-color: rgba(255,255,255,0.05);
            border: 3px dashed #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.15s;
            min-height: 100px;
            border-radius: 8px;
        }

        .more-card:hover { background-color: rgba(255,255,255,0.15); border-color: #ffcb05; }
        .more-card .plus-icon { font-size: 32px; color: #ffffff; margin-bottom: 2px; text-shadow: 1px 1px 0 #000;}
        .more-card span { font-size: 14px; color: #ffffff; font-weight: bold; text-shadow: 1px 1px 0 #000;}

        /* 彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #233363;
            border: 4px solid #ffffff;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);
            border-radius: 12px;
            width: 500px;
            max-width: 94%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0;
            position: relative;
            color: #ffffff;
        }

        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }

        .game-recipe-header {
            padding: 18px 20px;
            position: relative;
            border-bottom: 2px dashed #3a4e8c;
        }

        .game-recipe-header-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 2px 2px 0px #000;
        }

        .game-recipe-body {
            background-color: rgba(0,0,0,0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-recipe-body-info { display: flex; flex-direction: column; gap: 8px; }

        .game-recipe-icon-large {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border: 3px solid #ffffff;
            border-radius: 8px;
            background-color: transparent;
            image-rendering: pixelated;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .game-recipe-content { padding: 20px; }

        .recipe-top-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .btn-mini {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 0px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px #000;
        }
        .btn-mini:hover { background-color: #3a4e8c; }
        .btn-mini:active { transform: translateY(2px); box-shadow: 0 0px 0px #000; }

        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            padding: 8px 6px;
            border-bottom: 1px dashed #3a4e8c;
            border-radius: 4px;
            transition: background-color 0.15s;
        }

        .ingredient-row.selected-row {
            background-color: rgba(255, 203, 5, 0.15);
            border: 1px solid rgba(255, 203, 5, 0.5);
        }

        .ing-info-flex { display: flex; align-items: center; gap: 10px; }

        /* 勾選框樣式 */
        .ing-checkbox {
            width: 20px;
            height: 20px;
            accent-color: #ffcb05;
            cursor: pointer;
        }

        .close-btn, .save-btn {
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.5);
            width: 100%;
            margin-top: 15px;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
        }
        
        .close-btn { background-color: #e74c3c; }
        .close-btn:hover { background-color: #c0392b; }
        .save-btn { background-color: #2ecc71; }
        .save-btn:hover { background-color: #27ae60; }
        
        .close-btn:active, .save-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.5); }

        .badge-sell {
            background-color: transparent;
            color: #ffcb05;
            padding: 4px 8px;
            font-size: 13px;
            border: 1px solid #ffcb05;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
            text-shadow: 1px 1px 0px #000;
        }

        .inv-input, .recipe-input {
            width: 80px;
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 4px 8px;
            text-align: right;
            height: 34px;
            box-sizing: border-box;
            outline: none;
        }

        .text-input {
            width: 100%;
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 12px;
            outline: none;
        }

        label {
            font-size: 14px;
            color: #ffcb05;
            display: block;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>⚔️ 杖劍傳說 吃飽飽賺錢錢 🗡️</h1>
            <div class="header-btns">
                <button class="action-btn add-recipe" onclick="openAddRecipeModal()">➕ 新增食譜</button>
                <button class="action-btn" onclick="openInventoryEditModal()">📦 修改庫存</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchCharacter('rabbit', event)">小兔子</button>
            <button class="tab-btn" onclick="switchCharacter('artemis', event)">亞緹米絲</button>
        </div>

        <div class="section-header">
            <span class="section-title">食譜</span>
            <div class="filter-group">
                <!-- 習得狀態點選標籤 -->
                <div class="filter-tag-group" id="main-learned-tags">
                    <span class="tag-option sm active" onclick="setMainFilter('learned', 'ALL', this)">全部狀態</span>
                    <span class="tag-option sm" onclick="setMainFilter('learned', 'LEARNED', this)">已習得</span>
                    <span class="tag-option sm" onclick="setMainFilter('learned', 'UNLEARNED', this)">未取得</span>
                </div>
                <!-- 加成屬性點選標籤 -->
                <div class="filter-tag-group" id="main-attr-tags">
                    <span class="tag-option sm active" onclick="setMainFilter('attr', 'ALL', this)">全部屬性</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '攻擊', this)">攻擊</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '速度', this)">速度</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '生命', this)">生命</span>
                    <span class="tag-option sm" onclick="setMainFilter('attr', '防禦', this)">防禦</span>
                </div>
                <input type="text" id="recipe-search" class="search-input" placeholder="🔍 搜尋食譜..." oninput="renderUI()">
            </div>
        </div>
        <div id="recipe-container" class="grid-container"></div>

        <div class="section-header">
            <span class="section-title">可出售食材</span>
            <div class="filter-group">
                <input type="text" id="surplus-search" class="search-input" placeholder="🔍 搜尋食材..." oninput="renderUI()">
            </div>
        </div>
        <div id="surplus-container" class="grid-container"></div>
    </div>

    <!-- 食譜詳情彈跳視窗 -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <div id="modal-recipe-header-bg" class="game-recipe-header bg-rank-rare">
                <div class="recipe-top-actions">
                    <button id="modal-edit-btn" class="btn-mini">✏️ 編輯</button>
                    <button id="modal-delete-btn" class="btn-mini" style="background-color:#e74c3c;">🗑️ 刪除</button>
                </div>
                
                <!-- 標題與屬性圖示並列，緊靠 -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="game-recipe-header-title" id="modal-recipe-name">食譜名稱</div>
                    <div id="modal-recipe-attr-badge" style="display: flex; align-items: center;"></div>
                </div>
            </div>
            
            <div class="game-recipe-body">
                <div class="game-recipe-body-info">
                    <div style="font-size:14px; color:#b3c0e6;">料理配方</div>
                    <div id="modal-recipe-status-text" style="font-size:16px; font-weight:bold; color:#2ecc71; text-shadow:1px 1px 0px #000;">已習得</div>
                </div>
                <img id="modal-recipe-icon-lg" class="game-recipe-icon-large" src="" alt="Recipe Icon">
            </div>

            <div class="game-recipe-content">
                <div style="font-size:16px; font-weight:bold; color:#ffcb05; margin-bottom: 12px; border-bottom: 2px dashed #3a4e8c; padding-bottom: 8px; text-shadow: 1px 1px 0px #000;">配方材料</div>
                <div id="modal-recipe-ingredients-flex" style="display: flex; gap: 16px; margin-bottom: 15px; flex-wrap: wrap;"></div>
                <button class="close-btn" onclick="closeModal('recipe-modal')">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 所有食譜清單彈跳視窗 -->
    <div id="all-recipes-modal" class="modal">
        <div class="modal-content" style="padding: 20px;">
            <h2 style="font-size: 20px; color: #ffcb05; margin-bottom: 15px; text-shadow: 2px 2px 0px #000;">所有食譜總覽</h2>
            <div class="filter-group" style="margin-bottom: 15px; flex-wrap: wrap; justify-content: flex-start;">
                <div class="filter-tag-group" id="modal-learned-tags">
                    <span class="tag-option sm active" onclick="setModalFilter('learned', 'ALL', this)">全部狀態</span>
                    <span class="tag-option sm" onclick="setModalFilter('learned', 'LEARNED', this)">已習得</span>
                    <span class="tag-option sm" onclick="setModalFilter('learned', 'UNLEARNED', this)">未取得</span>
                </div>
                <div class="filter-tag-group" id="modal-attr-tags">
                    <span class="tag-option sm active" onclick="setModalFilter('attr', 'ALL', this)">全部屬性</span>
                    <span class="tag-option sm" onclick="setModalFilter('attr', '攻擊', this)">攻擊</span>
                    <span class="tag-option sm" onclick="setModalFilter('attr', '速度', this)">速度</span>
                    <span class="tag-option sm" onclick="setModalFilter('attr', '生命', this)">生命</span>
                    <span class="tag-option sm" onclick="setModalFilter('attr', '防禦', this)">防禦</span>
                </div>
                <input type="text" id="all-recipes-search" class="search-input" placeholder="🔍 搜尋食譜..." oninput="openAllRecipesModal()" style="flex: 1; min-width: 130px;">
            </div>
            <div id="all-recipes-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
            <button class="close-btn" onclick="closeModal('all-recipes-modal')">關閉視窗</button>
        </div>
    </div>

    <!-- 所有可出售食材彈跳視窗 -->
    <div id="all-surplus-modal" class="modal">
        <div class="modal-content" style="padding: 20px;">
            <h2 style="font-size: 20px; color: #ffcb05; margin-bottom: 15px; text-shadow: 2px 2px 0px #000;">所有可出售食材總覽</h2>
            <input type="text" id="all-surplus-search" class="search-input" placeholder="🔍 搜尋可出售食材..." oninput="openAllSurplusModal()" style="width: 100%; margin-bottom: 15px; height: 34px;">
            <div id="all-surplus-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
            <button class="close-btn" onclick="closeModal('all-surplus-modal')">關閉視窗</button>
        </div>
    </div>

    <!-- 修改庫存彈跳視窗 -->
    <div id="edit-inventory-modal" class="modal">
        <div class="modal-content" style="padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 3px dashed #3a4e8c; padding-bottom: 10px;">
                <h2 id="modal-inv-title" style="margin:0; font-size:20px; color:#ffcb05; text-shadow: 2px 2px 0px #000;">📦 修改庫存</h2>

        // 安全無縫圖片容錯機制 (尋找 .png -> .jpg -> .jpeg -> fallbackUrl)
        window.imgErr = function(img) {
            if (img.dataset.loaded === 'true') return;
            let name = img.getAttribute('data-name');
            let def = img.getAttribute('data-fallback');
            let attempt = parseInt(img.getAttribute('data-attempt') || '0');
            attempt++;
            img.setAttribute('data-attempt', attempt);

            if (attempt === 1) {
                img.src = name + '.jpg';
            } else if (attempt === 2) {
                img.src = name + '.jpeg';
            } else {
                img.dataset.loaded = 'true';
                img.onerror = null; 
                if (def) {
                    img.src = def;
                } else {
                    img.style.display = 'none';
                }
            }
        };

        // 背景圖片自動尋找載入機制
        function initBackground() {
            const bgList = ['背景圖片.png', '背景圖片.jpg', '背景圖片.jpeg', '1792464010100.jpg'];
            let bgIndex = 0;
            
            function tryNextBg() {
                if (bgIndex >= bgList.length) {
                    document.body.style.backgroundColor = '#111827';
                    return; 
                }
                let img = new Image();
                img.onload = () => {
                    document.body.style.backgroundImage = `url('${bgList[bgIndex]}')`;
                };
                img.onerror = () => {
                    bgIndex++;
                    tryNextBg();
                };
                img.src = bgList[bgIndex];
            }
            tryNextBg();
        }
        window.addEventListener('DOMContentLoaded', initBackground);

                document.getElementById(hiddenId).value = base64Str;

                img.src = base64Str;
                img.style.display = 'block';

            reader.readAsDataURL(file);

        // 計算食材狀態（包含欠缺與充足的所有已選食材）
        function calculateRecipeShortage(recipe, inv) {
            let missingItems = [];
            let allItems = [];
            let totalMissing = 0;
            if (recipe && recipe.ingredients) {
                for (let [ing, requiredQty] of Object.entries(recipe.ingredients)) {
                    const invQty = inv[ing] || 0;
                    const diff = Math.max(0, requiredQty - invQty);
                    if (diff > 0) {
                        totalMissing += diff;
                        missingItems.push({ name: ing, diff });
                    }
                    allItems.push({ name: ing, requiredQty, invQty, diff });
                }
            }
            return { totalMissing, missingItems, allItems };
        }

        function sortRecipesByMissing(recipes, inv) {
            let scoredRecipes = recipes.map((recipe, index) => {
                const shortage = calculateRecipeShortage(recipe, inv);
                return {
                    ...recipe,
                    originalIndex: index,
                    missingTotal: shortage.totalMissing,
                    missingItems: shortage.missingItems,
                    allItems: shortage.allItems
                };
            });

            scoredRecipes.sort((a, b) => {
                if (a.missingTotal === 0 && b.missingTotal > 0) return 1;
                if (a.missingTotal > 0 && b.missingTotal === 0) return -1;
                return a.missingTotal - b.missingTotal;
            });

            return scoredRecipes;
        }

        // 產生卡片上的食材列表 HTML（支援顯示「充足」）
        function buildCardIngredientsHtml(recipe, ingMap) {
            if (!recipe.allItems || recipe.allItems.length === 0) {
                return `<div style="font-size:13px; color:#2ecc71; font-weight:bold; background:rgba(46,204,113,0.1); padding:4px 6px; border:1px solid #2ecc71; border-radius: 4px; text-shadow: 1px 1px 0px #000;">充足 ✓</div>`;
            }

            const isAllSufficient = recipe.missingTotal === 0;
            const borderClass = isAllSufficient ? 'sufficient-border' : '';

            const itemsList = recipe.allItems.map(item => {
                const iconSrc = ingMap[item.name] ? ingMap[item.name].icon : "";
                const statusBadge = item.diff > 0
                    ? `<span class="qty-red">缺 ${item.diff}</span>`
                    : `<span class="qty-green">充足</span>`;
                return `
                    <div class="missing-ing-item">
                        ${renderImgHtml(iconSrc, "ing-icon", defaultIngIconImg, item.name)}
                        <span>${item.name}</span>
                        ${statusBadge}
                    </div>
                `;
            }).join('');

            return `<div class="missing-ing-list ${borderClass}">${itemsList}</div>`;
        }

            let ingredients = {};
            const rows = document.querySelectorAll('#new-recipe-ingredients-list .ingredient-row');
            rows.forEach(row => {
                const checkbox = row.querySelector('.ing-checkbox');
                const input = row.querySelector('.new-ing-input');
                const item = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                // 只要有打勾（即使數量為 0），或是數量大於 0，就納入食譜配方
                if (checkbox.checked || val > 0) {
                    ingredients[item] = val;
                }
            });

            if (Object.keys(ingredients).length === 0) {
                alert('請至少勾選一項所需食材！');
                return;
            }

            const recipes = getRecipes(currentKey);
            const recipeObj = { name, rank, learned, attr, icon, ingredients };
            let targetIndex = editIndex;

            if (editIndex >= 0 && editIndex < recipes.length) {
                recipes[editIndex] = recipeObj;
            } else {
                recipes.push(recipeObj);
                targetIndex = recipes.length - 1;
            }

            localStorage.setItem(`recipes_${currentKey}`, JSON.stringify(recipes));
            closeModal('add-recipe-modal');
            renderUI();

            openRecipeDetailByIndex(targetIndex);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 初始化渲染
        renderUI();
    </script>
</body>
</html>
