<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杖劍傳說 吃飽飽賺錢錢</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* 強制所有元素使用像素字體與字體陰影增加清晰度 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DotGothic16', monospace !important;
            letter-spacing: 1px;
        }

        /* 背景：全顯示不裁切 (contain)，JS會自動載入背景圖片 */
        body {
            background-color: #111827; 
            background-size: contain;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        /* 主容器：深藍色帶有 85% 不透明度，讓背景微透 */
        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: rgba(35, 51, 99, 0.85); 
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #3a4e8c;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 24px;
            color: #ffcb05;
            text-shadow: 2px 2px 0px #000000;
        }

        .header-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 角色切換標籤 */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
        }

        .tab-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.4);
        }

        .tab-btn.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            font-weight: bold;
            border-color: #ffcb05;
        }

        /* 動作按鈕 */
        .action-btn {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000000;
            white-space: nowrap;
        }

        .action-btn:hover { background-color: #3a4e8c; }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 0px 0px rgba(0,0,0,0.4); }

        .action-btn.add-recipe {
            background-color: #e74c3c;
            border-color: #ffffff;
        }
        .action-btn.add-recipe:hover { background-color: #c0392b; }

        /* 區塊標題與篩選列 */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 20px 0 15px 0;
            border-bottom: 2px dashed #3a4e8c;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 18px;
            color: #ffcb05;
            font-weight: bold;
            white-space: nowrap;
            margin-right: auto;
            text-shadow: 1px 1px 0px #000000;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* 點選標籤群組樣式 */
        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .filter-tag-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #3a4e8c;
        }

        .tag-option {
            background-color: #1c284d;
            color: #b3c0e6;
            border: 2px solid #3a4e8c;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
            user-select: none;
        }

        .tag-option.sm {
            padding: 3px 8px;
            font-size: 12px;
            border-width: 1px;
        }

        .tag-option:hover {
            background-color: #2c3e75;
            color: #ffffff;
        }

        .tag-option.active {
            background-color: #3a4e8c;
            color: #ffcb05;
            border-color: #ffcb05;
            font-weight: bold;
            box-shadow: 0 2px 0px rgba(0,0,0,0.4);
        }

        /* 搜尋輸入框 */
        .search-input {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 0 10px;
            height: 32px;
            font-size: 13px;
            box-sizing: border-box;
            margin: 0;
            outline: none;
            vertical-align: middle;
            text-shadow: 1px 1px 0px #000000;
            width: 135px;
            flex-shrink: 0;
        }
        .search-input::placeholder { color: #8a9fc4; text-shadow: none; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            min-height: 80px;
        }

        /* 卡片樣式 */
        .recipe-card {
            background-color: #1c284d;
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recipe-card.unlearned { background-color: #111827; opacity: 0.85; }
        .recipe-card:hover { background-color: #3a4e8c; transform: translate(-2px, -2px); box-shadow: 5px 5px 0px rgba(0,0,0,0.5); }
        .recipe-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }

        .recipe-header-flex { display: flex; align-items: center; gap: 12px; }

        .recipe-icon, .ing-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 4px;
            background-color: transparent;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        /* 屬性圖示 */
        .attr-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
            background-color: transparent;
        }

        /* 圓形食材 ICON 容器 (用於食譜詳情與主頁缺少食材) */
        .ing-circle-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background-color: rgba(0,0,0,0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            overflow: hidden;
            flex-shrink: 0;
        }

        .ing-circle-icon img { width: 80%; height: 80%; object-fit: contain; background-color: transparent;}

        /* 主頁與詳情頁共用的圓形食材並列區塊 */
        .recipe-ings-flex {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px dashed #e74c3c;
            padding: 8px;
            border-radius: 6px;
        }

        /* 食譜品質等級標題顏色 */
        .rank-rare { color: #5dade2 !important; text-shadow: 1px 1px 0px #000; }
        .rank-epic { color: #c39bd3 !important; text-shadow: 1px 1px 0px #000; }
        .rank-legend { color: #f39c12 !important; text-shadow: 1px 1px 0px #000; }
        .rank-miracle { color: #f1c40f !important; text-shadow: 1px 1px 0px #d35400; }

        /* 食譜品質漸層背景 */
        .bg-rank-rare { background: linear-gradient(135deg, #2980b9, #1c284d); }
        .bg-rank-epic { background: linear-gradient(135deg, #8e44ad, #1c284d); }
        .bg-rank-legend { background: linear-gradient(135deg, #d35400, #1c284d); }
        .bg-rank-miracle { background: linear-gradient(135deg, #f39c12, #1c284d); }

        .recipe-card p { font-size: 13px; color: #b3c0e6; margin: 0; text-shadow: 1px 1px 0px #000; }

        .qty-red { color: #ff4757; font-weight: bold; font-size: 13px; }
        .qty-green { color: #2ecc71; font-weight: bold; font-size: 13px; }

        /* 「+」展開按鈕卡片 */
        .more-card {
            background-color: rgba(255,255,255,0.05);
            border: 3px dashed #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.15s;
            min-height: 100px;
            border-radius: 8px;
        }

        .more-card:hover { background-color: rgba(255,255,255,0.15); border-color: #ffcb05; }
        .more-card .plus-icon { font-size: 32px; color: #ffffff; margin-bottom: 2px; text-shadow: 1px 1px 0 #000;}
        .more-card span { font-size: 14px; color: #ffffff; font-weight: bold; text-shadow: 1px 1px 0 #000;}

        /* 彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #233363;
            border: 4px solid #ffffff;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);
            border-radius: 12px;
            width: 580px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0;
            position: relative;
            color: #ffffff;
        }

        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }

        .game-recipe-header {
            padding: 18px 20px;
            position: relative;
            border-bottom: 2px dashed #3a4e8c;
        }

        .game-recipe-header-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 2px 2px 0px #000;
        }

        .game-recipe-body {
            background-color: rgba(0,0,0,0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-recipe-body-info { display: flex; flex-direction: column; gap: 6px; }

        .game-recipe-icon-large {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border: 3px solid #ffffff;
            border-radius: 8px;
            background-color: transparent;
            image-rendering: pixelated;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .game-recipe-content { padding: 20px; }

        .recipe-top-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .btn-mini {
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 0px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px #000;
        }
        .btn-mini:hover { background-color: #3a4e8c; }
        .btn-mini:active { transform: translateY(2px); box-shadow: 0 0px 0px #000; }

        /* 圖一風格：4欄式交易行網格排列 (用於庫存與食譜材料選擇) */
        .ing-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 360px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #ffffff;
            border-radius: 8px;
        }
        @media (max-width: 520px) {
            .ing-grid-4 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 380px) {
            .ing-grid-4 { grid-template-columns: repeat(2, 1fr); }
        }

        .ing-grid-card {
            background: linear-gradient(180deg, #2b3a67 0%, #1c284d 78%);
            border: 2px solid #4a62a8;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.15s;
            min-height: 118px;
            justify-content: space-between;
        }

        /* 卡片底部品質色暈 (如圖一) */
        .ing-grid-card.card-rank-一般 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(180, 190, 210, 0.35) 100%); }
        .ing-grid-card.card-rank-稀有 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(59, 130, 246, 0.5) 100%); }
        .ing-grid-card.card-rank-史詩 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(168, 85, 247, 0.55) 100%); }
        .ing-grid-card.card-rank-傳說 { background: linear-gradient(180deg, #2b3a67 0%, #1c284d 75%, rgba(249, 115, 22, 0.6) 100%); }

        .ing-grid-card.selected-row {
            border-color: #ffcb05;
            box-shadow: 0 0 8px rgba(255, 203, 5, 0.6);
            background: linear-gradient(180deg, #3a4e8c 0%, #233363 75%, rgba(255, 203, 5, 0.45) 100%);
        }

        .ing-card-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 2;
        }

        .ing-qty-corner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ing-qty-label {
            font-size: 10px;
            color: #b3c0e6;
            line-height: 1.1;
            text-shadow: 1px 1px 0 #000;
        }

        .ing-grid-input {
            width: 56px;
            background: rgba(0, 0, 0, 0.45);
            color: #ffffff;
            border: 1px solid #8a9fc4;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            padding: 1px 4px;
            text-align: left;
            outline: none;
            text-shadow: 1px 1px 0 #000;
        }
        .ing-grid-input:focus {
            border-color: #ffcb05;
            background: rgba(0, 0, 0, 0.75);
        }

        .ing-card-pic {
            width: 46px;
            height: 46px;
            object-fit: contain;
            margin: 2px 0;
            image-rendering: pixelated;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.6));
        }

        .ing-card-name {
            font-size: 12px;
            color: #ffffff;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 1px 1px 0 #000;
            padding-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .ing-card-name.editable-name {
            color: #ffcb05;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 勾選框樣式 */
        .ing-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #ffcb05;
            cursor: pointer;
        }

        /* 圖二風格：所有食譜總覽圓形徽章網格 */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            border: 2px solid #3a4e8c;
            max-height: 55vh;
            overflow-y: auto;
        }
        @media (max-width: 520px) {
            .overview-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 400px) {
            .overview-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .overview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .overview-item:hover {
            transform: scale(1.06);
        }

        .overview-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #888;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        /* 圖二品質圓框配色 */
        .overview-circle.circle-rare {
            background: radial-gradient(circle, #3b82f6 20%, #1d4ed8 90%);
            border-color: #60a5fa;
        }
        .overview-circle.circle-epic {
            background: radial-gradient(circle, #9333ea 20%, #581c87 90%);
            border-color: #c084fc;
        }
        .overview-circle.circle-legend {
            background: radial-gradient(circle, #ea580c 20%, #7c2d12 90%);
            border-color: #fb923c;
        }
        .overview-circle.circle-miracle {
            background: radial-gradient(circle, #ca8a04 20%, #713f12 90%);
            border-color: #fef08a;
            box-shadow: 0 0 12px rgba(254, 240, 138, 0.7), inset 0 0 10px rgba(0,0,0,0.6);
        }

        .overview-food-img {
            width: 76%;
            height: 76%;
            object-fit: contain;
            image-rendering: pixelated;
            border-radius: 50%;
        }

        /* 左上角加成屬性小徽章 (如圖二) */
        .overview-attr-badge {
            position: absolute;
            top: -3px;
            left: -3px;
            width: 24px;
            height: 24px;
            background-color: #1e1e24;
            border-radius: 50%;
            border: 1.5px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .overview-attr-badge img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .overview-name {
            font-size: 13px;
            color: #ffffff;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.2;
            word-break: keep-all;
        }

        /* 圖二明暗狀態控制：
           1. active-missing (有缺少份數)：維持原鮮豔色彩 (如太陽光暈)
           2. dimmed-sufficient (已習得但無缺少食材/份數0)：改暗保留色調 (如黃金散蛋)
           3. unlearned-gray (未取得食譜)：灰階暗化 (如星輝麵包) */
        .overview-item.dimmed-sufficient .overview-circle {
            filter: brightness(0.48) saturate(0.75);
        }
        .overview-item.dimmed-sufficient .overview-name {
            color: #9ca3af;
        }
        .overview-item.unlearned-gray .overview-circle {
            filter: grayscale(0.95) brightness(0.42);
            border-color: #52525b;
        }
        .overview-item.unlearned-gray .overview-name {
            color: #6b7280;
        }

        .close-btn, .save-btn {
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.5);
            width: 100%;
            margin-top: 15px;
            transition: all 0.1s;
            text-shadow: 1px 1px 0px #000;
        }
        
        .close-btn { background-color: #e74c3c; }
        .close-btn:hover { background-color: #c0392b; }
        .save-btn { background-color: #2ecc71; }
        .save-btn:hover { background-color: #27ae60; }
        
        .close-btn:active, .save-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.5); }

        .badge-sell {
            background-color: transparent;
            color: #ffcb05;
            padding: 4px 8px;
            font-size: 13px;
            border: 1px solid #ffcb05;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
            text-shadow: 1px 1px 0px #000;
        }

        .text-input {
            width: 100%;
            background-color: #1c284d;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 12px;
            outline: none;
        }

        label {
            font-size: 14px;
            color: #ffcb05;
            display: block;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>⚔️ 杖劍傳說 吃飽飽賺錢錢 🗡️</h1>
            <div class="header-btns">
                <button class="action-btn add-recipe" onclick="openAddRecipeModal()">➕ 新增食譜</button>
                <button class="action-btn" onclick="openInventoryEditModal()">📦 修改庫存</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchCharacter('rabbit', event)">小兔子</button>
            <button class="tab-btn" onclick="switchCharacter('artemis', event)">亞緹米絲</button>
        </div>

        <div class="section-header">
            <span class="section-title">食譜</span>

        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        function migrateRecipeFormat(r) {
            if (r.portions === undefined) {
                const vals = Object.values(r.ingredients || {}).filter(v => v > 0);
                if (vals.length > 0) {
                    let g = vals[0];
                    for (let i = 1; i < vals.length; i++) g = gcd(g, vals[i]);
                    if (g > 1) {
                        r.portions = g;
                        for (let k in r.ingredients) {
                            r.ingredients[k] = r.ingredients[k] > 0 ? Math.round(r.ingredients[k] / g) : 1;
                        }
                    } else {
                        r.portions = 1;
                        for (let k in r.ingredients) {
                            if (r.ingredients[k] === 0) r.ingredients[k] = 1;
                        }
                    }
                } else {
                    r.portions = 0;
                    for (let k in r.ingredients) {
                        if (r.ingredients[k] === 0) r.ingredients[k] = 1;
                    }
                }
            }
            return r;
        }

        function onIngCheckChange(checkbox) {
            const card = checkbox.closest('.ing-grid-card');
            const input = card.querySelector('.new-ing-input');
            if (checkbox.checked) {
                card.classList.add('selected-row');
                if ((parseInt(input.value) || 0) === 0) input.value = 1;
            } else {
                card.classList.remove('selected-row');
                input.value = 0;
            }
            sortRecipeIngCards();
        }

        function onIngQtyInput(input) {
            const card = input.closest('.ing-grid-card');
            const checkbox = card.querySelector('.ing-checkbox');
            const val = parseInt(input.value) || 0;
            if (val > 0 && !checkbox.checked) {
                checkbox.checked = true;
                card.classList.add('selected-row');
                sortRecipeIngCards();
            } else if (val === 0 && checkbox.checked) {
                checkbox.checked = false;
                card.classList.remove('selected-row');
                sortRecipeIngCards();
            }
        }

        function sortRecipeIngCards() {
            const container = document.getElementById('new-recipe-ingredients-list');
            if (!container) return;
            const cards = Array.from(container.querySelectorAll('.ing-grid-card'));
            cards.sort((a, b) => {
                const aChecked = a.querySelector('.ing-checkbox').checked ? 1 : 0;
                const bChecked = b.querySelector('.ing-checkbox').checked ? 1 : 0;
                if (aChecked !== bChecked) return bChecked - aChecked;
                const aOrder = parseInt(a.getAttribute('data-order')) || 0;
                const bOrder = parseInt(b.getAttribute('data-order')) || 0;
                return aOrder - bOrder;
            });
            cards.forEach(c => container.appendChild(c));
        }

        window.imgErr = function(img) {
            if (img.dataset.loaded === 'true') return;
            let name = img.getAttribute('data-name');
            let def = img.getAttribute('data-fallback');
            let attempt = parseInt(img.getAttribute('data-attempt') || '0');
            attempt++;
            img.setAttribute('data-attempt', attempt);

            if (attempt === 1) {
                img.src = name + '.jpg';
            } else if (attempt === 2) {
                img.src = name + '.jpeg';
            } else {
                img.dataset.loaded = 'true';
                img.onerror = null; 
                if (def) {
                    img.src = def;
                } else {
                    img.style.display = 'none';
                }
            }
        };

        function initBackground() {
            const bgList = ['背景圖片.png', '背景圖片.jpg', '背景圖片.jpeg', '1792464010100.jpg'];
            let bgIndex = 0;
            
            function tryNextBg() {
                if (bgIndex >= bgList.length) {
                    document.body.style.backgroundColor = '#111827';
                    return; 
                }
                let img = new Image();
                img.onload = () => {
                    document.body.style.backgroundImage = `url('${bgList[bgIndex]}')`;
                };
                img.onerror = () => {
                    bgIndex++;
                    tryNextBg();
                };
                img.src = bgList[bgIndex];
            }
            tryNextBg();
        }
        window.addEventListener('DOMContentLoaded', initBackground);

        function getIngredientsMap() {
            let map = { ...defaultIngredientsMap, ...userProvidedIngredientsMap };
            try {
                const saved = localStorage.getItem('global_ingredients_map');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    for (let [k, v] of Object.entries(parsed)) {
                        map[k] = { ...(map[k] || { rank: "一般", icon: "" }), ...v };
                    }
                }
            } catch (e) {}
            return map;

        function getAllIngredientsList() {
            const map = getIngredientsMap();
            const mapKeys = Object.keys(map);
            const ordered = [];
            INGREDIENT_ORDER.forEach(item => { ordered.push(item); });
            mapKeys.forEach(item => {
                if (!ordered.includes(item)) ordered.push(item);
            });
            return ordered;
        }

        function getSortedRecipeIngredientsEntries(ingredientsObj) {
            if (!ingredientsObj) return [];
            const entries = Object.entries(ingredientsObj);
            entries.sort((a, b) => {
                let idxA = INGREDIENT_ORDER.indexOf(a[0]);
                let idxB = INGREDIENT_ORDER.indexOf(b[0]);
                if (idxA === -1) idxA = 9999;
                if (idxB === -1) idxB = 9999;
                return idxA - idxB;
            });
            return entries;
        }

        function handleFileUpload(evt, hiddenId, previewId) {
            const file = evt.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Str = e.target.result;
                document.getElementById(hiddenId).value = base64Str;
                const img = document.getElementById(previewId);
                img.src = base64Str;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function removeUploadedFile(hiddenId, previewId, fileInputId) {
            document.getElementById(hiddenId).value = '';
            const img = document.getElementById(previewId);
            img.src = '';
            img.style.display = 'none';
            if (fileInputId) document.getElementById(fileInputId).value = '';
        }

        function renderImgHtml(iconUrl, className, fallbackUrl, itemName) {
            if (iconUrl && iconUrl.startsWith('data:image')) {
                return `<img src="${iconUrl}" class="${className}" alt="${itemName}">`;
            }
            if (itemName) {
                const safeName = String(itemName).replace(/"/g, "&quot;");
                return `<img src="${safeName}.png" class="${className}" data-name="${safeName}" data-fallback="${fallbackUrl}" data-attempt="0" onerror="window.imgErr(this)" alt="${safeName}">`;
            }
            return `<img src="${fallbackUrl}" class="${className}" alt="Default">`;
        }

        function syncBothCharactersRecipes() {
            const savedVer = localStorage.getItem('app_data_version');
            if (savedVer !== DATA_VERSION) {
                localStorage.setItem('global_ingredients_map', JSON.stringify(userProvidedIngredientsMap));
                localStorage.setItem('recipes_rabbit', JSON.stringify(userProvidedRabbitRecipes.map(migrateRecipeFormat)));
                localStorage.setItem('recipes_artemis', JSON.stringify(userProvidedArtemisRecipes.map(migrateRecipeFormat)));
                localStorage.setItem('inv_rabbit', JSON.stringify(userProvidedRabbitInv));
                localStorage.setItem('inv_artemis', JSON.stringify(userProvidedArtemisInv));
                localStorage.setItem('app_data_version', DATA_VERSION);
            }

            let rList = [];
            let aList = [];
            try {
                const rSaved = localStorage.getItem('recipes_rabbit');
                rList = rSaved ? JSON.parse(rSaved) : [...userProvidedRabbitRecipes];
            } catch (e) { rList = [...userProvidedRabbitRecipes]; }

            try {
                const aSaved = localStorage.getItem('recipes_artemis');
                aList = aSaved ? JSON.parse(aSaved) : [...userProvidedArtemisRecipes];
            } catch (e) { aList = [...userProvidedArtemisRecipes]; }

            rList = rList.map(migrateRecipeFormat);
            aList = aList.map(migrateRecipeFormat);

            rList.forEach(r => {
                if (!aList.some(a => a.name === r.name)) {
                    aList.push({
                        name: r.name,
                        rank: r.rank || '稀有',
                        learned: false,
                        portions: 0,
                        attr: r.attr || '攻擊',
                        icon: r.icon || '',
                        ingredients: { ...(r.ingredients || {}) }
                    });
                }
            });

            aList.forEach(a => {
                if (!rList.some(r => r.name === a.name)) {
                    rList.push({
                        name: a.name,
                        rank: a.rank || '稀有',
                        learned: false,
                        portions: 0,
                        attr: a.attr || '攻擊',
                        icon: a.icon || '',
                        ingredients: { ...(a.ingredients || {}) }
                    });
                }
            });

            localStorage.setItem('recipes_rabbit', JSON.stringify(rList));
            localStorage.setItem('recipes_artemis', JSON.stringify(aList));
        }

        function getRecipes(key) {
            try {
                const saved = localStorage.getItem(`recipes_${key}`);
                if (saved) return JSON.parse(saved).map(migrateRecipeFormat);
            } catch (e) {}
            return (key === 'rabbit' ? userProvidedRabbitRecipes : userProvidedArtemisRecipes).map(migrateRecipeFormat);

        function getInventory(key) {
            try {
                const saved = localStorage.getItem(`inv_${key}`);
                let inv = saved ? JSON.parse(saved) : (key === 'rabbit' ? userProvidedRabbitInv : userProvidedArtemisInv);
                getAllIngredientsList().forEach(item => {
                    if (inv[item] === undefined) inv[item] = 0;
                });
                return inv;
            } catch (e) {
                return key === 'rabbit' ? userProvidedRabbitInv : userProvidedArtemisInv;
            }
        }

        function getCircleRankClass(rank) {
            if (rank === "稀有") return "circle-rare";
            if (rank === "史詩") return "circle-epic";
            if (rank === "傳說") return "circle-legend";
            if (rank === "奇蹟") return "circle-miracle";
            return "circle-rare";
        }

        function getAttrBadgeHtml(attr) {
            if (!attr) return "";
            const attrBaseName = attrIconMap[attr];
            if (attrBaseName) {
                const safeAttr = String(attrBaseName).replace(/"/g, "&quot;");
                return `<img src="${safeAttr}.png" class="attr-icon" data-name="${safeAttr}" data-fallback="" data-attempt="0" onerror="window.imgErr(this)" alt="${safeAttr}" title="${safeAttr}屬性">`;
            }
            return "";
        }

        function calculateRecipeShortage(recipe, inv) {
            const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;
            let missingItems = [];
            let allItems = [];
            let totalMissing = 0;      
            let rawTotalMissing = 0;   

            if (recipe && recipe.ingredients) {
                const sortedEntries = getSortedRecipeIngredientsEntries(recipe.ingredients);
                for (let [ing, perPortionQty] of sortedEntries) {
                    const requiredQty = perPortionQty * portions;
                    const invQty = inv[ing] || 0;
                    const diff = Math.max(0, requiredQty - invQty);
                    if (diff > 0) {
                        rawTotalMissing += diff;
                        if (!EXCLUDED_INGS.includes(ing)) {
                            totalMissing += diff;
                        }
                        missingItems.push({ name: ing, perPortionQty, requiredQty, invQty, diff });
                    }
                    allItems.push({ name: ing, perPortionQty, requiredQty, invQty, diff });
                }
            }
            return { portions, totalMissing, rawTotalMissing, missingItems, allItems };
        }

        function sortRecipesByMissing(recipes, inv) {
            let scoredRecipes = recipes.map((recipe, index) => {
                const shortage = calculateRecipeShortage(recipe, inv);
                return {
                    ...recipe,
                    originalIndex: index,
                    portions: shortage.portions,
                    missingTotal: shortage.totalMissing,
                    rawTotalMissing: shortage.rawTotalMissing,
                    missingItems: shortage.missingItems,
                    allItems: shortage.allItems
                };
            });

            scoredRecipes.sort((a, b) => {
                const aGroup = a.missingTotal > 0 ? 0 : (a.portions > 0 ? 1 : 2);
                const bGroup = b.missingTotal > 0 ? 0 : (b.portions > 0 ? 1 : 2);
                if (aGroup !== bGroup) return aGroup - bGroup;
                if (aGroup === 0) return a.missingTotal - b.missingTotal;
                return (rankWeight[b.rank] || 1) - (rankWeight[a.rank] || 1);
            });

            return scoredRecipes;
        }

        function buildMainPageMissingHtml(recipe, ingMap) {
            if (recipe.portions === 0) {
                return `<div style="font-size:12px; color:#9ca3af; padding:4px 0;">所需份數：0 份</div>`;
            }
            const displayMissing = recipe.missingItems.filter(item => !EXCLUDED_INGS.includes(item.name));
            if (displayMissing.length === 0) {
                return `<div style="font-size:13px; color:#2ecc71; font-weight:bold; background:rgba(46,204,113,0.1); padding:4px 6px; border:1px solid #2ecc71; border-radius: 4px; text-shadow: 1px 1px 0px #000;">主要食材充足 ✓</div>`;
            }

            const itemsHtml = displayMissing.map(item => {
                const iconSrc = ingMap[item.name] ? ingMap[item.name].icon : "";
                return `
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
                        <div class="ing-circle-icon">
                            ${renderImgHtml(iconSrc, "", defaultIngIconImg, item.name)}
                        </div>
                        <span style="font-size:12px; color:#ffffff; text-shadow: 1px 1px 0 #000;">${item.name}</span>
                        <span class="qty-red" style="font-size:13px; text-shadow: 1px 1px 0 #000;">缺 ${item.diff}</span>
                    </div>
                `;
            }).join('');

            return `<div class="recipe-ings-flex">${itemsHtml}</div>`;
        }

            try {

                const inv = getInventory(currentKey);
                const ingMap = getIngredientsMap();

                const recipeSearchKey = document.getElementById('recipe-search')?.value.trim().toLowerCase() || '';

                if (!recipeContainer || !surplusContainer) return;

                let sortedRecipes = sortRecipesByMissing(recipes, inv);

                if (currentMainLearnedFilter === 'LEARNED') {
                    sortedRecipes = sortedRecipes.filter(r => r.learned !== false);
                } else if (currentMainLearnedFilter === 'UNLEARNED') {
                    sortedRecipes = sortedRecipes.filter(r => r.learned === false);
                }

                if (currentMainAttrFilter !== 'ALL') {
                    sortedRecipes = sortedRecipes.filter(r => r.attr === currentMainAttrFilter);
                }

                if (recipeSearchKey) {
                    sortedRecipes = sortedRecipes.filter(r => r.name.toLowerCase().includes(recipeSearchKey));
                }

                const top3Recipes = sortedRecipes.slice(0, 3);
                if (top3Recipes.length > 0) {
                    top3Recipes.forEach(recipe => {
                        const ingListHtml = buildMainPageMissingHtml(recipe, ingMap);
                        const rankClass = getRankClass(recipe.rank || "稀有");
                        const unlearnedClass = recipe.learned === false ? 'unlearned' : '';

                        recipeContainer.innerHTML += `
                            <div class="recipe-card ${unlearnedClass}" onclick="openRecipeDetailByIndex(${recipe.originalIndex})">

                        <span>顯示更多食譜</span>
                    </div>

                let totalDemand = {};

                    const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;
                    if (recipe.ingredients && portions > 0) {
                        for (let [ing, perPortionQty] of Object.entries(recipe.ingredients)) {
                            totalDemand[ing] = (totalDemand[ing] || 0) + (perPortionQty * portions);
                        }
                    }
                });

                let surplusList = [];
                for (let [item, invQty] of Object.entries(inv)) {
                    if (EXCLUDED_INGS.includes(item)) continue;
                    const demQty = totalDemand[item] || 0;
                    if (invQty > demQty) {
                        const ingMeta = ingMap[item] || { rank: "一般", icon: "" };
                        surplusList.push({ name: item, inventory: invQty, demand: demQty, surplus: invQty - demQty, ...ingMeta });
                    }
                }
                surplusList.sort((a, b) => b.surplus - a.surplus);

                if (surplusSearchKey) {
                    surplusList = surplusList.filter(s => s.name.toLowerCase().includes(surplusSearchKey));
                }

                const top3Surplus = surplusList.slice(0, 3);

                        <span>更多可出售</span>

        function saveSingleIngredientInfo() {
            const origName = document.getElementById('editing-ing-original-name').value;
            const newName = document.getElementById('edit-ing-name').value.trim();
            const newRank = document.getElementById('edit-ing-rank').value;
            const newIcon = document.getElementById('edit-ing-icon-base64').value;

            if (!newName) {
                alert('請輸入食材名稱！');
                return;
            }

            let ingMap = getIngredientsMap();

            if (origName) {
                if (origName !== newName && ingMap[newName]) {
                    alert('已有該食材！');
                    return;
                }
                if (origName !== newName) {
                    delete ingMap[origName];
                    ['rabbit', 'artemis'].forEach(key => {
                        let inv = getInventory(key);
                        if (inv[origName] !== undefined) {
                            inv[newName] = inv[origName];
                            delete inv[origName];
                            localStorage.setItem(`inv_${key}`, JSON.stringify(inv));
                        }
                        let recipes = getRecipes(key);
                        recipes.forEach(r => {
                            if (r.ingredients && r.ingredients[origName] !== undefined) {
                                r.ingredients[newName] = r.ingredients[origName];
                                delete r.ingredients[origName];
                            }
                        });
                        localStorage.setItem(`recipes_${key}`, JSON.stringify(recipes));
                    });
                }
                ingMap[newName] = { rank: newRank, icon: newIcon };
            } else {
                if (ingMap[newName]) {
                    alert('已有該食材！');
                    return;
                }
                ingMap[newName] = { rank: newRank, icon: newIcon };
            }

            saveIngredientsMap(ingMap);
            closeModal('edit-ingredient-item-modal');

            if (addIngReturnTarget === 'recipe') {
                const currentSelections = {};
                document.querySelectorAll('#new-recipe-ingredients-list .ing-grid-card').forEach(card => {
                    const cb = card.querySelector('.ing-checkbox');
                    const inp = card.querySelector('.new-ing-input');
                    const item = inp.getAttribute('data-item');
                    if (cb.checked) {
                        currentSelections[item] = parseInt(inp.value) || 0;
                    }
                });
                currentSelections[newName] = 1;
                document.getElementById('recipe-ing-search').value = '';
                populateRecipeIngredientsGrid(currentSelections);
            } else {
                const inv = getInventory(currentKey);
                document.querySelectorAll('#inventory-edit-list .inv-input').forEach(inp => {
                    inv[inp.getAttribute('data-item')] = parseInt(inp.value) || 0;
                });
                if (inv[newName] === undefined) inv[newName] = 0;
                renderInventoryEditList(inv);
                filterInventoryList();
            }
            renderUI();
        }

        function saveInventory() {
            const inv = getInventory(currentKey);
            const inputs = document.querySelectorAll('.inv-input');

            inputs.forEach(input => {
                const item = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                inv[item] = val;
            });

            localStorage.setItem(`inv_${currentKey}`, JSON.stringify(inv));
            closeModal('edit-inventory-modal');
            renderUI();
        }

        function filterRecipeIngList() {
            const filterKey = document.getElementById('recipe-ing-search').value.trim().toLowerCase();
            const cards = document.querySelectorAll('#new-recipe-ingredients-list .ing-grid-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name') || '';
                card.style.display = (!filterKey || name.includes(filterKey)) ? 'flex' : 'none';
            });
        }

        function populateRecipeIngredientsGrid(selectedMap = {}) {
            const listContainer = document.getElementById('new-recipe-ingredients-list');
            listContainer.innerHTML = '';
            const ingMap = getIngredientsMap();
            const allList = getAllIngredientsList();

            allList.forEach((item, index) => {
                const isSelected = Object.prototype.hasOwnProperty.call(selectedMap, item);
                const currentQty = isSelected ? selectedMap[item] : 0;
                const ingMeta = ingMap[item] || { rank: "一般", icon: "" };
                const rank = ingMeta.rank || "一般";

                listContainer.innerHTML += `
                    <div class="ing-grid-card card-rank-${rank} ${isSelected ? 'selected-row' : ''}" data-order="${index}" data-name="${item.toLowerCase()}">
                        <div class="ing-card-top">
                            <div class="ing-qty-corner">
                                <input type="number" class="ing-grid-input new-ing-input" data-item="${item}" value="${currentQty}" min="0" oninput="onIngQtyInput(this)">
                                <span class="ing-qty-label">每份用量</span>
                            </div>
                            <input type="checkbox" class="ing-checkbox" data-item="${item}" ${isSelected ? 'checked' : ''} onchange="onIngCheckChange(this)">
                        </div>
                        ${renderImgHtml(ingMeta.icon, "ing-card-pic", defaultIngIconImg, item)}
                        <div class="ing-card-name" title="${item}">${item}</div>
                    </div>
                `;
            });

            sortRecipeIngCards();
        }

        function openAddRecipeModal() {
            document.getElementById('recipe-editor-title').innerText = '➕ 新增食譜';
            document.getElementById('editing-recipe-index').value = '-1';
            document.getElementById('new-recipe-name').value = '';
            document.getElementById('new-recipe-portions').value = '1';
            
            setTagGroupValue('new-recipe-rank', 'new-recipe-rank-tags', '稀有');
            setTagGroupValue('new-recipe-status', 'new-recipe-status-tags', 'true');
            setTagGroupValue('new-recipe-attr', 'new-recipe-attr-tags', '攻擊');
            
            document.getElementById('new-recipe-icon-base64').value = '';
            
            const preview = document.getElementById('new-recipe-icon-preview');
            preview.removeAttribute('data-loaded');
            preview.onerror = null;
            preview.src = defaultRecipeIconImg;
            preview.style.display = 'block';
            
            document.getElementById('recipe-file-input').value = '';
            document.getElementById('recipe-ing-search').value = '';

            populateRecipeIngredientsGrid({});

            document.getElementById('add-recipe-modal').style.display = 'flex';
        }

        function openEditRecipeModal(recipeIndex) {
            const recipes = getRecipes(currentKey);
            const recipe = recipes[recipeIndex];

            if (!recipe) return;

            const portions = recipe.portions !== undefined ? Number(recipe.portions) : 1;

            document.getElementById('recipe-editor-title').innerText = `✏️ 編輯食譜：${recipe.name}`;
            document.getElementById('editing-recipe-index').value = recipeIndex;
            document.getElementById('new-recipe-name').value = recipe.name;
            document.getElementById('new-recipe-portions').value = portions;
            
            setTagGroupValue('new-recipe-rank', 'new-recipe-rank-tags', recipe.rank || '稀有');
            setTagGroupValue('new-recipe-status', 'new-recipe-status-tags', recipe.learned !== false ? 'true' : 'false');
            setTagGroupValue('new-recipe-attr', 'new-recipe-attr-tags', recipe.attr || '攻擊');
            
            document.getElementById('new-recipe-icon-base64').value = recipe.icon || '';
            
            const preview = document.getElementById('new-recipe-icon-preview');
            preview.removeAttribute('data-loaded');
            if (recipe.icon && recipe.icon.startsWith('data:image')) {
                preview.onerror = null;
                preview.src = recipe.icon;
            } else {
                preview.setAttribute('data-name', recipe.name);
                preview.setAttribute('data-fallback', defaultRecipeIconImg);
                preview.setAttribute('data-attempt', '0');
                preview.onerror = function() { window.imgErr(this); };
                preview.src = `${recipe.name}.png`;
            }
            preview.style.display = 'block';
            
            document.getElementById('recipe-file-input').value = '';
            document.getElementById('recipe-ing-search').value = '';

            populateRecipeIngredientsGrid(recipe.ingredients || {});

            document.getElementById('add-recipe-modal').style.display = 'flex';
        }

        function saveRecipe() {
            const name = document.getElementById('new-recipe-name').value.trim();
            const rank = document.getElementById('new-recipe-rank').value;
            const learned = document.getElementById('new-recipe-status').value === 'true';
            const portions = Math.max(0, parseInt(document.getElementById('new-recipe-portions').value) || 0);
            const attr = document.getElementById('new-recipe-attr').value;
            const icon = document.getElementById('new-recipe-icon-base64').value;
            const editIndex = parseInt(document.getElementById('editing-recipe-index').value);

            if (!name) {
                alert('請輸入食譜名稱！');
                return;
            }

            const recipes = getRecipes(currentKey);
            const duplicateIdx = recipes.findIndex((r, idx) => r.name === name && idx !== editIndex);
            if (duplicateIdx !== -1) {
                alert('已有該食譜！');
                return;
            }

            let rawIngredients = {};
            const cards = document.querySelectorAll('#new-recipe-ingredients-list .ing-grid-card');
            cards.forEach(card => {
                const checkbox = card.querySelector('.ing-checkbox');
                const input = card.querySelector('.new-ing-input');
                const item = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                if (checkbox.checked || val > 0) {
                    rawIngredients[item] = val;
                }
            });

            if (Object.keys(rawIngredients).length === 0) {
                alert('請至少勾選一項所需食材！');
                return;
            }

            let ingredients = {};
            getSortedRecipeIngredientsEntries(rawIngredients).forEach(([k, v]) => {
                ingredients[k] = v;
            });

            const recipeObj = { name, rank, learned, portions, attr, icon, ingredients };
            const otherKey = currentKey === 'rabbit' ? 'artemis' : 'rabbit';
            let otherRecipes = getRecipes(otherKey);

            let targetIndex = editIndex;

            if (editIndex >= 0 && editIndex < recipes.length) {
                const oldName = recipes[editIndex].name;
                recipes[editIndex] = recipeObj;

                const otherIdx = otherRecipes.findIndex(r => r.name === oldName || r.name === name);
                if (otherIdx !== -1) {
                    otherRecipes[otherIdx] = {
                        ...otherRecipes[otherIdx],
                        name,
                        rank,
                        attr,
                        icon: icon || otherRecipes[otherIdx].icon,
                        ingredients: { ...ingredients }
                    };
                } else {
                    otherRecipes.push({
                        name,
                        rank,
                        learned: false,
                        portions: 0,
                        attr,
                        icon,
                        ingredients: { ...ingredients }
                    });
                }
            } else {
                recipes.push(recipeObj);
                targetIndex = recipes.length - 1;

                if (!otherRecipes.some(r => r.name === name)) {
                    otherRecipes.push({
                        name,
                        rank,
                        learned: false,
                        portions: 0,
                        attr,
                        icon,
                        ingredients: { ...ingredients }
                    });
                }
            }

            localStorage.setItem(`recipes_${currentKey}`, JSON.stringify(recipes));
            localStorage.setItem(`recipes_${otherKey}`, JSON.stringify(otherRecipes));
            closeModal('add-recipe-modal');
            renderUI();

            openRecipeDetailByIndex(targetIndex);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function setupSearchInputs() {
            const bindSearch = (id, callback) => {
                const el = document.getElementById(id);
                if (!el) return;
                let isComposing = false;
                el.addEventListener('compositionstart', () => { isComposing = true; });
                el.addEventListener('compositionend', () => {
                    isComposing = false;
                    callback();
                });
                el.addEventListener('input', () => {
                    if (!isComposing) callback();
                });
            };

            bindSearch('recipe-search', renderUI);
            bindSearch('surplus-search', renderUI);
            bindSearch('all-recipes-search', openAllRecipesModal);
            bindSearch('all-surplus-search', openAllSurplusModal);
            bindSearch('inv-search', filterInventoryList);
            bindSearch('recipe-ing-search', filterRecipeIngList);
        }

        // 初始化執行
        syncBothCharactersRecipes();
        setupSearchInputs();
        renderUI();
    </script>
</body>
</html>
